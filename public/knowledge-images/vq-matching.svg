<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>通氣與血流配合(V/Q)：正常、分流、無效腔</title>
<rect width="1000" height="470" fill="#FFFFFF"/>
<text x="170.0" y="40.0" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">正常</text>
<text x="170.0" y="64.0" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">V/Q 約 0.8</text>
<rect x="156" y="80" width="28" height="70" fill="#FCE4EC" stroke="#AD1457"/>
<path d="M170,86 L170,140" stroke="#00838F" stroke-width="3" marker-end="url(#ar)"/>
<ellipse cx="170" cy="215" rx="85" ry="68" fill="#FFF8E1" stroke="#AD1457" stroke-width="2"/>
<text x="170.0" y="212.0" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">肺泡有空氣</text>
<text x="170.0" y="232.0" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">O₂ 進、CO₂ 出</text>
<rect x="30" y="299" width="280" height="32" rx="16" fill="#FFCDD2" stroke="#B71C1C"/>
<path d="M40,315 L290,315" stroke="#555" stroke-width="3" marker-end="url(#ag)"/>
<text x="40.0" y="353.0" font-size="13" fill="#1565C0" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">缺氧血</text>
<text x="300.0" y="353.0" font-size="13" fill="#B71C1C" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">充氧血</text>
<text x="170.0" y="395.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">例：氣進得去，血也流得過</text>
<text x="500.0" y="40.0" font-size="20" fill="#1565C0" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">分流(V/Q 低)</text>
<text x="500.0" y="64.0" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">有血流、沒通氣</text>
<rect x="486" y="80" width="28" height="70" fill="#FCE4EC" stroke="#AD1457"/>
<ellipse cx="500" cy="215" rx="70" ry="55" fill="#BBDEFB" stroke="#AD1457" stroke-width="2"/>
<text x="500.0" y="212.0" font-size="14" fill="#0D47A1" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">塌陷或充滿液體</text>
<text x="500.0" y="232.0" font-size="14" fill="#0D47A1" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">氣體進不來</text>
<rect x="360" y="299" width="280" height="32" rx="16" fill="#FFCDD2" stroke="#B71C1C"/>
<path d="M370,315 L620,315" stroke="#555" stroke-width="3" marker-end="url(#ag)"/>
<text x="370.0" y="353.0" font-size="13" fill="#1565C0" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">缺氧血</text>
<text x="630.0" y="353.0" font-size="13" fill="#1565C0" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">仍是缺氧血</text>
<text x="500.0" y="395.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">例：肺擴張不全、肺炎、ARDS、肺水腫</text>
<text x="830.0" y="40.0" font-size="20" fill="#C62828" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">無效腔(V/Q 高)</text>
<text x="830.0" y="64.0" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">有通氣、沒血流</text>
<rect x="816" y="80" width="28" height="70" fill="#FCE4EC" stroke="#AD1457"/>
<path d="M830,86 L830,140" stroke="#00838F" stroke-width="3" marker-end="url(#ar)"/>
<ellipse cx="830" cy="215" rx="85" ry="68" fill="#FFF8E1" stroke="#AD1457" stroke-width="2"/>
<text x="830.0" y="212.0" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">肺泡有空氣</text>
<text x="830.0" y="232.0" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">O₂ 進、CO₂ 出</text>
<rect x="690" y="299" width="280" height="32" rx="16" fill="#FFCDD2" stroke="#B71C1C"/>
<ellipse cx="770" cy="315" rx="26" ry="15" fill="#7F0000"/><text x="770.0" y="357.0" font-size="14" fill="#7F0000" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">血栓</text>
<path d="M695,315 L735,315" stroke="#1565C0" stroke-width="4" marker-end="url(#ab)"/>
<text x="870.0" y="320.0" font-size="14" fill="#B71C1C" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">血流不過去</text>
<text x="830.0" y="395.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">例：肺栓塞</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00838F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="500.0" y="432.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">分流：給氧改善有限，要把肺泡打開(PEEP、深呼吸、翻身)；無效腔：通氣浪費掉，PaCO₂ 可能上升</text>
<text x="500.0" y="456.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">低氧性肺血管收縮：通氣差的區域血管收縮，把血流導向通氣好的肺泡，讓 V/Q 恢復配合</text>
</svg>
