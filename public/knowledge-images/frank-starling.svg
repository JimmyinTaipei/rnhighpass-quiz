<text x="100" y="106" font-size="12.5" text-anchor="start" font-weight="normal" fill="#B4485C" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">衰竭心臟曲線低平,再加前負荷只增加充血,SV 增加有限</text>
<text x="380" y="520" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#6B6B75" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">血管擴張劑(↓後負荷)可讓衰竭心臟的曲線同樣往上移</text>
