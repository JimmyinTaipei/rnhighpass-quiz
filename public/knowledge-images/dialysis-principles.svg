<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>透析的三種原理：擴散、超過濾、對流</title>
  <rect width="780" height="380" fill="#FFFFFF"/>
  <defs>
    <marker id="dp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555A66"/>
    </marker>
    <marker id="dp-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C5A96"/>
    </marker>
    <marker id="dp-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/>
    </marker>
  </defs>
  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#26262B">透析的原理</text>

  <!-- ===== 1 擴散 ===== -->
  <g transform="translate(20,50)">
    <text x="115" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#26262B">① 擴散</text>
    <text x="115" y="38" text-anchor="middle" font-size="12" fill="#555A66">溶質由高濃度往低濃度移動</text>
    <rect x="10" y="52" width="100" height="190" fill="#FFF4F4" stroke="#B4485C"/>
    <rect x="120" y="52" width="100" height="190" fill="#EAF1FA" stroke="#2C5A96"/>
    <line x1="115" y1="52" x2="115" y2="242" stroke="#555A66" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="60" y="262" text-anchor="middle" font-size="13" fill="#B4485C">血液</text>
    <text x="170" y="262" text-anchor="middle" font-size="13" fill="#2C5A96">透析液</text>
    <!-- 尿素、鉀：血液多 -->
    <g fill="#B4485C">
      <circle cx="32" cy="80" r="5"/><circle cx="70" cy="74" r="5"/><circle cx="50" cy="104" r="5"/><circle cx="88" cy="112" r="5"/>
      <circle cx="30" cy="140" r="5"/><circle cx="66" cy="150" r="5"/><circle cx="92" cy="176" r="5"/><circle cx="40" cy="190" r="5"/>
      <circle cx="74" cy="214" r="5"/><circle cx="26" cy="226" r="5"/>
      <circle cx="150" cy="96" r="5"/><circle cx="190" cy="196" r="5"/>
    </g>
    <!-- 碳酸氫根：透析液多 -->
    <g fill="#2C5A96">
      <rect x="140" y="130" width="9" height="9"/><rect x="186" y="80" width="9" height="9"/><rect x="200" y="140" width="9" height="9"/>
      <rect x="160" y="220" width="9" height="9"/><rect x="58" y="176" width="9" height="9"/>
    </g>
    <line x1="86" y1="136" x2="146" y2="136" stroke="#B4485C" stroke-width="2.5" marker-end="url(#dp-arr-r)"/>
    <line x1="150" y1="166" x2="88" y2="166" stroke="#2C5A96" stroke-width="2.5" marker-end="url(#dp-arr-b)"/>
    <circle cx="20" cy="290" r="5" fill="#B4485C"/>
    <text x="30" y="294" font-size="12" fill="#26262B">尿素、肌酸酐、鉀 → 透析液</text>
    <rect x="15" y="306" width="9" height="9" fill="#2C5A96"/>
    <text x="30" y="315" font-size="12" fill="#26262B">碳酸氫根、鈣 → 血液</text>
  </g>

  <!-- ===== 2 超過濾 ===== -->
  <g transform="translate(275,50)">
    <text x="115" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#26262B">② 超過濾</text>
    <text x="115" y="38" text-anchor="middle" font-size="12" fill="#555A66">壓力差把水分擠出去(脫水)</text>
    <rect x="10" y="52" width="100" height="190" fill="#FFF4F4" stroke="#B4485C"/>
    <rect x="120" y="52" width="100" height="190" fill="#EAF1FA" stroke="#2C5A96"/>
    <line x1="115" y1="52" x2="115" y2="242" stroke="#555A66" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="60" y="262" text-anchor="middle" font-size="13" fill="#B4485C">血液(正壓)</text>
    <text x="170" y="262" text-anchor="middle" font-size="13" fill="#2C5A96">透析液(負壓)</text>
    <g fill="#7FB3E0">
      <circle cx="34" cy="86" r="4"/><circle cx="62" cy="100" r="4"/><circle cx="40" cy="128" r="4"/><circle cx="80" cy="150" r="4"/>
      <circle cx="30" cy="176" r="4"/><circle cx="64" cy="200" r="4"/><circle cx="90" cy="222" r="4"/>
      <circle cx="146" cy="110" r="4"/><circle cx="176" cy="150" r="4"/><circle cx="150" cy="190" r="4"/><circle cx="196" cy="214" r="4"/>
    </g>
    <line x1="40" y1="98" x2="104" y2="98" stroke="#555A66" stroke-width="4" marker-end="url(#dp-arr)"/>
    <line x1="40" y1="148" x2="104" y2="148" stroke="#555A66" stroke-width="4" marker-end="url(#dp-arr)"/>
    <line x1="40" y1="198" x2="104" y2="198" stroke="#555A66" stroke-width="4" marker-end="url(#dp-arr)"/>
    <line x1="126" y1="148" x2="190" y2="148" stroke="#2C5A96" stroke-width="2" marker-end="url(#dp-arr-b)"/>
    <circle cx="20" cy="290" r="4" fill="#7FB3E0"/>
    <text x="30" y="294" font-size="12" fill="#26262B">水分子</text>
    <text x="15" y="315" font-size="12" fill="#26262B">血液透析靠它移除多餘水分</text>
  </g>

  <!-- ===== 3 對流 ===== -->
  <g transform="translate(530,50)">
    <text x="115" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#26262B">③ 對流</text>
    <text x="115" y="38" text-anchor="middle" font-size="12" fill="#555A66">大量水流把溶質一起帶走</text>
    <rect x="10" y="52" width="100" height="190" fill="#FFF4F4" stroke="#B4485C"/>
    <rect x="120" y="52" width="100" height="190" fill="#F3F4F8" stroke="#555A66"/>
    <line x1="115" y1="52" x2="115" y2="242" stroke="#555A66" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="60" y="262" text-anchor="middle" font-size="13" fill="#B4485C">血液</text>
    <text x="170" y="262" text-anchor="middle" font-size="13" fill="#555A66">濾出液(丟棄)</text>
    <g fill="#7FB3E0">
      <circle cx="30" cy="80" r="4"/><circle cx="76" cy="92" r="4"/><circle cx="36" cy="160" r="4"/><circle cx="84" cy="206" r="4"/>
      <circle cx="140" cy="100" r="4"/><circle cx="196" cy="128" r="4"/><circle cx="146" cy="214" r="4"/><circle cx="186" cy="194" r="4"/>
    </g>
    <g fill="#B4485C">
      <circle cx="56" cy="120" r="5"/><circle cx="30" cy="214" r="5"/><circle cx="166" cy="84" r="5"/><circle cx="170" cy="160" r="5"/><circle cx="204" cy="226" r="5"/>
    </g>
    <g fill="#D9A23A">
      <circle cx="80" cy="150" r="8"/><circle cx="186" cy="100" r="8"/>
    </g>
    <path d="M30,136 C60,136 80,132 104,132" fill="none" stroke="#555A66" stroke-width="4" marker-end="url(#dp-arr)"/>
    <path d="M30,186 C60,186 80,182 104,182" fill="none" stroke="#555A66" stroke-width="4" marker-end="url(#dp-arr)"/>
    <circle cx="20" cy="290" r="7" fill="#D9A23A"/>
    <text x="32" y="294" font-size="12" fill="#26262B">中大分子(部分藥物、毒素)</text>
    <text x="15" y="315" font-size="12" fill="#26262B">CVVH 用它；要輸補充液</text>
  </g>
</svg>
