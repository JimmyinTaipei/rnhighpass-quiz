<rect x="440.0" y="90" width="80.0" height="290" fill="#FFFFFF" opacity="0.55"/>
<rect x="405.7" y="90" width="34.3" height="290" fill="#EF9A9A" opacity="0.55"/>
<text x="500" y="34" font-size="20" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">柯氏音與血壓判讀(示意)</text>
