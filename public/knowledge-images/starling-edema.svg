<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>微血管的液體交換(Starling 力)與水腫的四個機轉</title>
<rect width="1000" height="440" fill="#FFFFFF"/>
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AD5C28"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C99A4B"/></marker>
<marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0AC"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker></defs>
<text x="500" y="34" font-size="21" text-anchor="middle" font-weight="bold" fill="#26262B">微血管的液體交換與水腫的四個機轉</text>
<defs><linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#E38A97"/><stop offset="1" stop-color="#7FA6D6"/></linearGradient></defs>
<rect x="60" y="60" width="880" height="210" rx="14" fill="#FBF6EE" stroke="#D8C9AE"/>
<text x="500" y="82" font-size="13" text-anchor="middle" fill="#5B6170">組織間隙</text>
<rect x="140" y="150" width="720" height="46" rx="23" fill="url(#cap)" stroke="#8C6B70" stroke-width="1.5"/>
<text x="130" y="178" font-size="14" text-anchor="end" font-weight="bold" fill="#B4485C">小動脈端</text>
<text x="870" y="178" font-size="14" text-anchor="start" font-weight="bold" fill="#3A6EA5">小靜脈端</text>
<line x1="250" y1="148" x2="250" y2="100" stroke="#B4485C" stroke-width="3" marker-end="url(#mr)"/>
<line x1="330" y1="148" x2="330" y2="100" stroke="#B4485C" stroke-width="3" marker-end="url(#mr)"/>
<text x="290" y="94" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#B4485C">靜水壓 ＞ 膠體滲透壓 → 液體濾出</text>
<line x1="670" y1="100" x2="670" y2="146" stroke="#3A6EA5" stroke-width="3" marker-end="url(#mb)"/>
<line x1="750" y1="100" x2="750" y2="146" stroke="#3A6EA5" stroke-width="3" marker-end="url(#mb)"/>
<text x="710" y="94" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#3A6EA5">膠體滲透壓 ＞ 靜水壓 → 液體回收</text>
<path d="M420,250 C470,215 530,215 580,250" fill="none" stroke="#3E7C57" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
<line x1="500" y1="212" x2="500" y2="238" stroke="#3E7C57" stroke-width="2.5" marker-end="url(#mg)"/>
<text x="500" y="264" font-size="13" text-anchor="middle" fill="#3E7C57">沒回收的少量液體由淋巴管帶走</text>
<text x="500" y="178" font-size="12" text-anchor="middle" fill="#26262B">靜水壓(把水推出去)：小動脈端高 → 小靜脈端低　｜　膠體滲透壓(白蛋白把水留住)：兩端差不多</text>
<rect x="40" y="300" width="220" height="120" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="150.0" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">① 靜水壓 ↑</text>
<text x="150.0" y="346" font-size="13" text-anchor="middle" fill="#26262B">心衰竭(右心衰竭→下肢)</text>
<text x="150.0" y="365" font-size="13" text-anchor="middle" fill="#26262B">深部靜脈血栓、靜脈阻塞</text>
<text x="150.0" y="384" font-size="13" text-anchor="middle" fill="#26262B">鈉水滯留、門脈高壓</text>
<rect x="275" y="300" width="220" height="120" rx="10" fill="#E3EDF8" stroke="#3A6EA5" stroke-width="1.6"/>
<text x="385.0" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">② 膠體滲透壓 ↓(白蛋白 ↓)</text>
<text x="385.0" y="346" font-size="13" text-anchor="middle" fill="#26262B">腎病症候群(尿中流失)</text>
<text x="385.0" y="365" font-size="13" text-anchor="middle" fill="#26262B">肝硬化(製造減少)</text>
<text x="385.0" y="384" font-size="13" text-anchor="middle" fill="#26262B">蛋白質營養不良</text>
<rect x="510" y="300" width="220" height="120" rx="10" fill="#F8EADF" stroke="#AD5C28" stroke-width="1.6"/>
<text x="620.0" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">③ 微血管通透性 ↑</text>
<text x="620.0" y="346" font-size="13" text-anchor="middle" fill="#26262B">發炎、過敏反應</text>
<text x="620.0" y="365" font-size="13" text-anchor="middle" fill="#26262B">燒傷</text>
<text x="620.0" y="384" font-size="13" text-anchor="middle" fill="#26262B">敗血症</text>
<rect x="745" y="300" width="220" height="120" rx="10" fill="#E6F2EA" stroke="#3E7C57" stroke-width="1.6"/>
<text x="855.0" y="324" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">④ 淋巴回流受阻</text>
<text x="855.0" y="346" font-size="13" text-anchor="middle" fill="#26262B">淋巴結廓清(乳癌術後)</text>
<text x="855.0" y="365" font-size="13" text-anchor="middle" fill="#26262B">絲蟲病(象皮腫)</text>
<text x="855.0" y="384" font-size="13" text-anchor="middle" fill="#26262B">腫瘤壓迫</text>
</svg>