<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>單純氣胸與張力性氣胸</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker></defs>
<rect width="980" height="520" fill="#FFFFFF"/>
<path d="M60,110 Q60,70 130,70 L360,70 Q430,70 430,110 L430,380 Q245,420 60,380 Z" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/>
<path d="M295,90 L415,90 L415,385 L295,395 Z" fill="#B3E5FC" opacity="0.9"/>
<ellipse cx="150.0" cy="230" rx="70" ry="135" fill="#F8BBD0" stroke="#AD1457" stroke-width="2"/>
<ellipse cx="320.0" cy="200" rx="45" ry="80" fill="#F48FB1" stroke="#AD1457" stroke-width="2"/>
<path d="M235,90 L235,300" stroke="#78909C" stroke-width="12" stroke-linecap="round"/>
<path d="M245,20 L245,60 Q245,85 235,100" stroke="#78909C" stroke-width="12" fill="none" stroke-linecap="round"/>
<ellipse cx="235" cy="310" rx="48" ry="40" fill="#E57373" stroke="#B71C1C" stroke-width="2"/>
<path d="M560,110 Q560,70 630,70 L860,70 Q930,70 930,110 L930,380 Q745,420 560,380 Z" fill="#FFF8E1" stroke="#8D6E63" stroke-width="2.5"/>
<path d="M740,90 L915,90 L915,385 L740,395 Z" fill="#B3E5FC" opacity="0.9"/>
<ellipse cx="622.5" cy="230" rx="55" ry="135" fill="#F8BBD0" stroke="#AD1457" stroke-width="2"/>
<ellipse cx="803.5" cy="200" rx="22" ry="45" fill="#F48FB1" stroke="#AD1457" stroke-width="2"/>
<path d="M680,90 L680,300" stroke="#78909C" stroke-width="12" stroke-linecap="round"/>
<path d="M745,20 L745,60 Q745,85 680,100" stroke="#78909C" stroke-width="12" fill="none" stroke-linecap="round"/>
<ellipse cx="680" cy="310" rx="48" ry="40" fill="#E57373" stroke="#B71C1C" stroke-width="2"/>
<text x="245.0" y="48.0" font-size="19" fill="#263238" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">單純氣胸</text>
<text x="745.0" y="48.0" font-size="19" fill="#B71C1C" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">張力性氣胸</text>
<text x="350.0" y="345.0" font-size="15" fill="#01579B" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">空氣</text>
<text x="845.0" y="200.0" font-size="15" fill="#01579B" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">空氣</text>
<text x="245.0" y="420.0" font-size="13" fill="#455A64" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">縱膈腔、氣管在中線</text>
<path d="M910,150 L820,150" stroke="#C62828" stroke-width="3" marker-end="url(#ar)"/>
<path d="M910,230 L820,230" stroke="#C62828" stroke-width="3" marker-end="url(#ar)"/>
<path d="M910,310 L820,310" stroke="#C62828" stroke-width="3" marker-end="url(#ar)"/>
<text x="820.0" y="395.0" font-size="14" fill="#C62828" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">空氣越積越多，壓力推向健側</text>
<text x="640.0" y="62.0" font-size="14" fill="#C62828" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">氣管偏向健側</text>
<path d="M690,68 L702,88" stroke="#C62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="685.0" y="365.0" font-size="13" fill="#B71C1C" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">心臟、大血管受壓</text>
<text x="30.0" y="456.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">患側：呼吸音減弱或消失、叩診過度反響音、胸廓起伏變小</text>
<text x="30.0" y="478.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">張力性：吸氣時空氣進入肋膜腔、吐氣出不去(單向活瓣) → 縱膈腔與氣管推向健側</text>
<text x="30.0" y="500.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">→ 靜脈回流減少、心輸出量下降 → 低血壓、休克；立即針刺減壓，再放胸管</text>
</svg>
