<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>利尿劑在腎元的作用部位</title>
  <rect width="760" height="540" fill="#FFFFFF"/>
  <defs>
    <marker id="dn-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555A66"/>
    </marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#26262B">利尿劑在腎元的作用部位</text>

  <!-- 皮質/髓質分界 -->
  <line x1="20" y1="200" x2="740" y2="200" stroke="#C9CCD6" stroke-dasharray="6 5"/>
  <text x="24" y="192" font-size="12" fill="#888">皮質</text>
  <text x="24" y="218" font-size="12" fill="#888">髓質</text>

  <!-- 腎絲球 -->
  <circle cx="80" cy="110" r="34" fill="#FDE8EC" stroke="#B4485C" stroke-width="2"/>
  <text x="80" y="106" text-anchor="middle" font-size="13" fill="#B4485C">腎絲球</text>
  <text x="80" y="122" text-anchor="middle" font-size="11" fill="#B4485C">過濾</text>

  <!-- 腎小管 -->
  <path d="M114,110 C140,90 160,130 185,110 C205,94 222,124 240,110 L250,110 L250,430 Q250,462 282,462 Q314,462 314,430 L314,110 L330,110 C350,92 368,128 390,110 C408,96 420,120 440,110 L520,110 L520,500"
        fill="none" stroke="#2C5A96" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.28"/>
  <path d="M114,110 C140,90 160,130 185,110 C205,94 222,124 240,110 L250,110 L250,430 Q250,462 282,462 Q314,462 314,430 L314,110 L330,110 C350,92 368,128 390,110 C408,96 420,120 440,110 L520,110 L520,500"
        fill="none" stroke="#2C5A96" stroke-width="2" stroke-linejoin="round"/>
  <line x1="314" y1="300" x2="314" y2="112" stroke="#2C5A96" stroke-width="6"/>
  <text x="178" y="80" text-anchor="middle" font-size="13" fill="#2C5A96">近曲小管</text>
  <text x="240" y="356" text-anchor="end" font-size="12" fill="#2C5A96">下降支</text>
  <text x="240" y="372" text-anchor="end" font-size="11" fill="#2C5A96">(水可通過)</text>
  <text x="386" y="80" text-anchor="middle" font-size="13" fill="#2C5A96">遠曲小管</text>
  <text x="530" y="490" font-size="13" fill="#2C5A96">集尿管 → 尿液</text>

  <!-- 近曲小管 標註 -->
  <rect x="40" y="232" width="176" height="86" rx="10" fill="#F3F4F8" stroke="#8A8FA0"/>
  <text x="52" y="254" font-size="13" font-weight="bold" fill="#26262B">近曲小管 ~65% Na⁺</text>
  <text x="52" y="274" font-size="12" fill="#26262B">• Acetazolamide(碳酸酐</text>
  <text x="52" y="290" font-size="12" fill="#26262B">  酶抑制)• SGLT2i</text>
  <text x="52" y="308" font-size="12" fill="#26262B">• Mannitol 滲透性(全段)</text>
  <line x1="150" y1="232" x2="178" y2="122" stroke="#555A66" stroke-width="1.3" marker-end="url(#dn-arr)"/>

  <!-- Loop -->
  <rect x="336" y="232" width="164" height="112" rx="10" fill="#FDE8EC" stroke="#B4485C" stroke-width="1.5"/>
  <text x="348" y="256" font-size="14" font-weight="bold" fill="#B4485C">① 亨利氏環利尿劑</text>
  <text x="348" y="276" font-size="12" fill="#26262B">上升支粗段</text>
  <text x="348" y="294" font-size="12" fill="#26262B">阻斷 Na⁺-K⁺-2Cl⁻</text>
  <text x="348" y="312" font-size="12" fill="#26262B">~25% Na⁺ → 最強效</text>
  <text x="348" y="330" font-size="12" fill="#26262B">Furosemide</text>
  <line x1="336" y1="276" x2="320" y2="276" stroke="#555A66" stroke-width="1.3" marker-end="url(#dn-arr)"/>

  <!-- Thiazide -->
  <rect x="560" y="46" width="186" height="104" rx="10" fill="#FDF6E3" stroke="#AD5C28" stroke-width="1.5"/>
  <text x="572" y="70" font-size="14" font-weight="bold" fill="#AD5C28">② Thiazide 類</text>
  <text x="572" y="90" font-size="12" fill="#26262B">遠曲小管</text>
  <text x="572" y="108" font-size="12" fill="#26262B">阻斷 Na⁺-Cl⁻ 共同運輸</text>
  <text x="572" y="126" font-size="12" fill="#26262B">~5–10% Na⁺;中等強度</text>
  <text x="572" y="143" font-size="12" fill="#26262B">HCTZ、indapamide</text>
  <path d="M560,98 C520,70 460,70 420,100" fill="none" stroke="#555A66" stroke-width="1.3" marker-end="url(#dn-arr)"/>

  <!-- 保鉀 -->
  <rect x="560" y="228" width="186" height="150" rx="10" fill="#E7F2EA" stroke="#3E7C57" stroke-width="1.5"/>
  <text x="572" y="252" font-size="14" font-weight="bold" fill="#3E7C57">③ 保鉀利尿劑</text>
  <text x="572" y="272" font-size="12" fill="#26262B">集尿管(主細胞)</text>
  <text x="572" y="292" font-size="12" fill="#26262B">• Spironolactone、</text>
  <text x="572" y="308" font-size="12" fill="#26262B">  Eplerenone:拮抗醛固酮</text>
  <text x="572" y="326" font-size="12" fill="#26262B">• Amiloride、Triamterene:</text>
  <text x="572" y="342" font-size="12" fill="#26262B">  阻斷 ENaC 鈉通道</text>
  <text x="572" y="364" font-size="12" fill="#26262B">~2–5% Na⁺;弱,但保鉀</text>
  <line x1="560" y1="300" x2="526" y2="300" stroke="#555A66" stroke-width="1.3" marker-end="url(#dn-arr)"/>

  <!-- 說明 -->
  <rect x="20" y="398" width="210" height="126" rx="10" fill="#FFFFFF" stroke="#D0D3DC"/>
  <text x="32" y="420" font-size="13" font-weight="bold" fill="#26262B">為什麼 ①② 會低血鉀?</text>
  <text x="32" y="442" font-size="12" fill="#26262B">上游少吸收的 Na⁺ 被沖到</text>
  <text x="32" y="460" font-size="12" fill="#26262B">集尿管,在醛固酮作用下</text>
  <text x="32" y="478" font-size="12" fill="#26262B">「換」出 K⁺ 與 H⁺ →</text>
  <text x="32" y="496" font-size="12" fill="#26262B">低血鉀、代謝性鹼中毒;</text>
  <text x="32" y="514" font-size="12" fill="#26262B">③ 直接擋住這個交換。</text>
</svg>
