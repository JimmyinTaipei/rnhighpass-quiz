<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>減數分裂不分離造成三體症與單體症</title>
<rect width="1000" height="560" fill="#FFFFFF"/>
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AD5C28"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C99A4B"/></marker>
<marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0AC"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker></defs>
<text x="500" y="32" font-size="20" text-anchor="middle" font-weight="bold" fill="#26262B">減數分裂「不分離」：三體症與單體症的來源</text>
<circle cx="140" cy="140" r="48" fill="#F7DDE2" stroke="#B4485C" stroke-width="1.6"/>
<rect x="127" y="124" width="8" height="32" rx="4" fill="#3A6EA5"/>
<rect x="145" y="124" width="8" height="32" rx="4" fill="#B4485C"/>
<text x="140" y="210" font-size="13" text-anchor="middle" fill="#26262B">一對同源染色體</text>
<text x="140" y="232" font-size="11.5" text-anchor="middle" fill="#5B6170">(一條來自父、一條來自母)</text>
<line x1="195" y1="140" x2="265" y2="140" stroke="#26262B" stroke-width="2" marker-end="url(#mk)"/>
<text x="232" y="125" font-size="12" text-anchor="middle" fill="#5B6170">正常</text>
<circle cx="330" cy="95" r="34" fill="#F7DDE2" stroke="#B4485C" stroke-width="1.6"/>
<rect x="326" y="79" width="8" height="32" rx="4" fill="#3A6EA5"/>
<circle cx="330" cy="190" r="34" fill="#F7DDE2" stroke="#B4485C" stroke-width="1.6"/>
<rect x="326" y="174" width="8" height="32" rx="4" fill="#B4485C"/>
<text x="330" y="248" font-size="13" text-anchor="middle" fill="#26262B">每個配子各一條(n)</text>
<line x1="195" y1="170" x2="265" y2="330" stroke="#B4485C" stroke-width="2" marker-end="url(#mr)"/>
<text x="206" y="262" font-size="13" text-anchor="start" font-weight="bold" fill="#B4485C">不分離</text>
<circle cx="330" cy="330" r="34" fill="#F7DDE2" stroke="#B4485C" stroke-width="1.6"/>
<rect x="317" y="314" width="8" height="32" rx="4" fill="#3A6EA5"/>
<rect x="335" y="314" width="8" height="32" rx="4" fill="#B4485C"/>
<text x="330" y="384" font-size="13" text-anchor="middle" font-weight="bold" fill="#26262B">多一條(n+1)</text>
<circle cx="330" cy="430" r="34" fill="#F7DDE2" stroke="#B4485C" stroke-width="1.6"/>
<text x="330" y="484" font-size="13" text-anchor="middle" font-weight="bold" fill="#26262B">少一條(n−1)</text>
<line x1="370" y1="330" x2="470" y2="330" stroke="#26262B" stroke-width="2" marker-end="url(#mk)"/>
<line x1="370" y1="430" x2="470" y2="430" stroke="#26262B" stroke-width="2" marker-end="url(#mk)"/>
<text x="420" y="316" font-size="12" text-anchor="middle" fill="#5B6170">＋正常配子</text>
<text x="420" y="416" font-size="12" text-anchor="middle" fill="#5B6170">＋正常配子</text>
<rect x="480" y="295" width="210" height="70" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="585.0" y="319" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">三體症(2n+1＝47)</text>
<text x="585.0" y="341" font-size="12.5" text-anchor="middle" fill="#26262B">例：唐氏症(三體 21)</text>
<rect x="480" y="395" width="210" height="70" rx="10" fill="#E3EDF8" stroke="#3A6EA5" stroke-width="1.6"/>
<text x="585.0" y="419" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">單體症(2n−1＝45)</text>
<text x="585.0" y="441" font-size="12.5" text-anchor="middle" fill="#26262B">例：透納氏症(45,X)</text>
<rect x="720" y="70" width="260" height="430" rx="10" fill="#F6F7FA" stroke="#9AA0AC" stroke-width="1.6"/>
<text x="850.0" y="94" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">唐氏症的三種成因</text>
<text x="850" y="130" font-size="14" text-anchor="middle" font-weight="bold" fill="#B4485C">不分離(約 95%)</text>
<text x="850" y="152" font-size="12.5" text-anchor="middle" fill="#26262B">多為卵子的減數分裂錯誤</text>
<text x="850" y="172" font-size="12.5" text-anchor="middle" fill="#26262B">與母親年齡增加有關</text>
<text x="850" y="192" font-size="12.5" text-anchor="middle" fill="#26262B">不是遺傳來的，再發率低</text>
<text x="850" y="234" font-size="14" text-anchor="middle" font-weight="bold" fill="#B4485C">羅伯遜易位(約 4%)</text>
<text x="850" y="256" font-size="12.5" text-anchor="middle" fill="#26262B">第 21 號接到另一條染色體上</text>
<text x="850" y="276" font-size="12.5" text-anchor="middle" fill="#26262B">父或母可能是平衡易位帶因者</text>
<text x="850" y="296" font-size="12.5" text-anchor="middle" fill="#26262B">可遺傳、再發率較高</text>
<text x="850" y="338" font-size="14" text-anchor="middle" font-weight="bold" fill="#B4485C">鑲嵌型(約 1%)</text>
<text x="850" y="360" font-size="12.5" text-anchor="middle" fill="#26262B">受精後細胞分裂出錯</text>
<text x="850" y="380" font-size="12.5" text-anchor="middle" fill="#26262B">部分細胞正常、症狀較輕</text>
<text x="500" y="540" font-size="13" text-anchor="middle" fill="#5B6170">性染色體也會不分離：47,XXY(柯林菲特氏症)、45,X(透納氏症)、47,XXX</text>
</svg>