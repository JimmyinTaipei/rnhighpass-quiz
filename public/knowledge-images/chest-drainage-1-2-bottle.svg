<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>單瓶式與雙瓶式胸腔水下引流</title>
<rect width="1100" height="560" fill="#FFFFFF"/>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker></defs>
<text x="200.0" y="40.0" font-size="19" fill="#263238" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">單瓶式：水封瓶兼收集瓶</text>
<rect x="120" y="250" width="160" height="220" rx="16" fill="#FAFAFA" stroke="#455A64" stroke-width="2.5"/>
<rect x="145" y="236" width="110" height="16" rx="4" fill="#90A4AE"/>
<text x="200.0" y="498.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">水封瓶(同時收集)</text>
<rect x="122" y="330" width="156" height="138" rx="12" fill="#E8C4D0"/>
<path d="M170,120 L170,250 L170,350" stroke="#555" stroke-width="5" fill="none" stroke-linejoin="round"/>
<path d="M235,280 L235,180" stroke="#555" stroke-width="5" fill="none" stroke-linejoin="round"/>
<text x="170.0" y="110.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">來自胸管</text>
<text x="235.0" y="172.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">通大氣</text>
<path d="M192,330 L192,350" stroke="#1565C0" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>
<text x="198.0" y="346.0" font-size="12" fill="#1565C0" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">約 2 cm</text>
<text x="200.0" y="430.0" font-size="13" fill="#880E4F" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">水＋引流液混在一起</text>
<text x="40.0" y="530.0" font-size="13" fill="#C62828" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">引流液一多，液面升高、長管沒入變深 → 排氣阻力變大</text>
<text x="800.0" y="40.0" font-size="19" fill="#263238" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">雙瓶式：收集瓶＋水封瓶</text>
<rect x="600" y="250" width="160" height="220" rx="16" fill="#FAFAFA" stroke="#455A64" stroke-width="2.5"/>
<rect x="625" y="236" width="110" height="16" rx="4" fill="#90A4AE"/>
<text x="680.0" y="498.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">① 收集瓶</text>
<rect x="840" y="250" width="160" height="220" rx="16" fill="#FAFAFA" stroke="#455A64" stroke-width="2.5"/>
<rect x="865" y="236" width="110" height="16" rx="4" fill="#90A4AE"/>
<text x="920.0" y="498.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">② 水封瓶</text>
<rect x="602" y="400" width="156" height="68" rx="12" fill="#EF9A9A"/>
<rect x="842" y="340" width="156" height="128" rx="12" fill="#BBDEFB"/>
<path d="M645,120 L645,310" stroke="#555" stroke-width="5" fill="none" stroke-linejoin="round"/>
<path d="M715,290 L715,200 L890,200 L890,360" stroke="#555" stroke-width="5" fill="none" stroke-linejoin="round"/>
<path d="M955,280 L955,180" stroke="#555" stroke-width="5" fill="none" stroke-linejoin="round"/>
<text x="645.0" y="110.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">來自胸管</text>
<text x="955.0" y="172.0" font-size="14" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">通大氣(或接抽吸)</text>
<path d="M912,340 L912,360" stroke="#1565C0" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>
<text x="918.0" y="356.0" font-size="12" fill="#1565C0" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">約 2 cm</text>
<text x="680.0" y="430.0" font-size="13" fill="#B71C1C" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">引流液</text>
<text x="560.0" y="530.0" font-size="13" fill="#1565C0" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">液體留在收集瓶，水封深度固定；加第三瓶控制負壓＝三瓶式</text>
<line x1="550" y1="60" x2="550" y2="510" stroke="#E0E0E0" stroke-width="2"/>
<text x="550.0" y="554.0" font-size="12" fill="#777" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">示意圖，比例不準；現在醫院多用一體成型的引流箱，內部分格原理相同</text>
</svg>
