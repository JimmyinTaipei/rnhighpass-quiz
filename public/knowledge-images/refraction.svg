<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>正視、近視與遠視的成像位置與矯正</title>
<rect width="980" height="560" fill="#FFFFFF"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker></defs>
<text x="490.0" y="32" font-size="20" text-anchor="middle" font-weight="bold" fill="#26262B">正視、近視、遠視：光線聚焦的位置與矯正鏡片</text>
<text x="40" y="95" font-size="17" text-anchor="start" font-weight="bold" fill="#3E7C57">正視</text>
<text x="40" y="117" font-size="13" text-anchor="start" font-weight="normal" fill="#26262B">焦點落在視網膜上</text>
<circle cx="560" cy="125" r="60" fill="#FFF7F0" stroke="#26262B" stroke-width="2"/><path d="M598.5672565811924,79.03733341286133 A60,60 0 0,1 598.5672565811924,170.96266658713867" fill="none" stroke="#AD5C28" stroke-width="6"/><ellipse cx="516" cy="125" rx="9" ry="26" fill="#DCEBF7" stroke="#3A6EA5" stroke-width="1.5"/><line x1="380" y1="105" x2="516" y2="105" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="105" x2="618" y2="125" stroke="#26262B" stroke-width="1.5"/><line x1="380" y1="125" x2="516" y2="125" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="125" x2="618" y2="125" stroke="#26262B" stroke-width="1.5"/><line x1="380" y1="145" x2="516" y2="145" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="145" x2="618" y2="125" stroke="#26262B" stroke-width="1.5"/><circle cx="618" cy="125" r="5" fill="#B4485C"/><text x="618" y="111" font-size="12" text-anchor="middle" font-weight="bold" fill="#B4485C">焦點</text>
<text x="628" y="175" font-size="12" text-anchor="start" font-weight="normal" fill="#AD5C28">視網膜</text>
<text x="40" y="250" font-size="17" text-anchor="start" font-weight="bold" fill="#3A6EA5">近視</text>
<text x="40" y="272" font-size="13" text-anchor="start" font-weight="normal" fill="#26262B">眼軸太長或屈光力太強 → 焦點在視網膜前</text>
<text x="40" y="294" font-size="13" text-anchor="start" font-weight="bold" fill="#6B5CA5">用凹透鏡矯正(發散光線)</text>
<circle cx="560" cy="280" r="60" fill="#FFF7F0" stroke="#26262B" stroke-width="2"/><path d="M598.5672565811924,234.03733341286133 A60,60 0 0,1 598.5672565811924,325.9626665871387" fill="none" stroke="#AD5C28" stroke-width="6"/><ellipse cx="516" cy="280" rx="9" ry="26" fill="#DCEBF7" stroke="#3A6EA5" stroke-width="1.5"/><line x1="380" y1="260" x2="516" y2="260" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="260" x2="578" y2="280" stroke="#26262B" stroke-width="1.5"/><line x1="578" y1="280" x2="616" y2="291.0" stroke="#26262B" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="380" y1="280" x2="516" y2="280" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="280" x2="578" y2="280" stroke="#26262B" stroke-width="1.5"/><line x1="578" y1="280" x2="616" y2="280.0" stroke="#26262B" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="380" y1="300" x2="516" y2="300" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="300" x2="578" y2="280" stroke="#26262B" stroke-width="1.5"/><line x1="578" y1="280" x2="616" y2="269.0" stroke="#26262B" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="578" cy="280" r="5" fill="#B4485C"/><text x="578" y="266" font-size="12" text-anchor="middle" font-weight="bold" fill="#B4485C">焦點</text>
<text x="628" y="330" font-size="12" text-anchor="start" font-weight="normal" fill="#AD5C28">視網膜</text>
<path d="M826,240 Q840,280 826,320 L854,320 Q840,280 854,240 Z" fill="#E7E2F5" stroke="#6B5CA5" stroke-width="2"/><text x="840" y="340" font-size="13" text-anchor="middle" font-weight="bold" fill="#6B5CA5">凹透鏡</text>
<text x="40" y="405" font-size="17" text-anchor="start" font-weight="bold" fill="#B4485C">遠視</text>
<text x="40" y="427" font-size="13" text-anchor="start" font-weight="normal" fill="#26262B">眼軸太短或屈光力太弱 → 焦點在視網膜後</text>
<text x="40" y="449" font-size="13" text-anchor="start" font-weight="bold" fill="#6B5CA5">用凸透鏡矯正(聚合光線)</text>
<circle cx="560" cy="435" r="60" fill="#FFF7F0" stroke="#26262B" stroke-width="2"/><path d="M598.5672565811924,389.0373334128613 A60,60 0 0,1 598.5672565811924,480.9626665871387" fill="none" stroke="#AD5C28" stroke-width="6"/><ellipse cx="516" cy="435" rx="9" ry="26" fill="#DCEBF7" stroke="#3A6EA5" stroke-width="1.5"/><line x1="380" y1="415" x2="516" y2="415" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="415" x2="658" y2="435" stroke="#26262B" stroke-width="1.5"/><line x1="380" y1="435" x2="516" y2="435" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="435" x2="658" y2="435" stroke="#26262B" stroke-width="1.5"/><line x1="380" y1="455" x2="516" y2="455" stroke="#26262B" stroke-width="1.5"/><line x1="516" y1="455" x2="658" y2="435" stroke="#26262B" stroke-width="1.5"/><circle cx="658" cy="435" r="5" fill="#B4485C"/><text x="666" y="425" font-size="12" text-anchor="start" font-weight="bold" fill="#B4485C">焦點</text>
<text x="628" y="485" font-size="12" text-anchor="start" font-weight="normal" fill="#AD5C28">視網膜</text>
<path d="M840,395 Q862,435 840,475 Q818,435 840,395 Z" fill="#E7E2F5" stroke="#6B5CA5" stroke-width="2"/><text x="840" y="495" font-size="13" text-anchor="middle" font-weight="bold" fill="#6B5CA5">凸透鏡</text>
<text x="490.0" y="546" font-size="13" text-anchor="middle" font-weight="normal" fill="#8A8A93">老花眼：水晶體彈性變差、看近無法調節 → 用凸透鏡；散光：角膜弧度不均 → 用圓柱鏡片</text>
</svg>
