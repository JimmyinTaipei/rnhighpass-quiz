<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>急性心肌梗塞後心肌生化標記的時間變化</title>
  <rect width="760" height="590" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#26262B">急性心肌梗塞後心肌生化標記的時間變化(示意)</text>
  <text x="380" y="52" text-anchor="middle" font-size="12.5" fill="#6B6B73">縱軸為相對高度示意,非實際濃度;第 1 天以小時放大顯示</text>
  <line x1="80" y1="400" x2="735" y2="400" stroke="#26262B" stroke-width="1.5"/>
  <line x1="80" y1="400" x2="80" y2="80" stroke="#26262B" stroke-width="1.5"/>
  <text x="30" y="240" font-size="13" fill="#26262B" transform="rotate(-90 30 240)" text-anchor="middle">血中濃度(相對)</text>
  <line x1="80" y1="360" x2="735" y2="360" stroke="#8A8A92" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="470" y1="76" x2="510" y2="76" stroke="#8A8A92" stroke-width="1.2" stroke-dasharray="6 4"/><text x="516" y="80" font-size="12" fill="#6B6B73">正常上限(Troponin 為第 99 百分位)</text>
  <line x1="250" y1="80" x2="250" y2="400" stroke="#D0D0D6" stroke-width="1" stroke-dasharray="2 4"/>
