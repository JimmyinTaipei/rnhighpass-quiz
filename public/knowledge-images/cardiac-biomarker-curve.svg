  <text x="262" y="180" font-size="14" font-weight="bold" fill="#2C5A96">CK-MB</text><text x="262" y="197" font-size="12" fill="#2C5A96">2–3 天恢復</text>
  <text x="320" y="108" font-size="14" font-weight="bold" fill="#B4485C">Troponin I / T</text><text x="320" y="125" font-size="12" fill="#B4485C">最具心肌專一性;持續 7–14 天</text>
  <text x="470" y="258" font-size="14" font-weight="bold" fill="#3E7C57">LDH</text><text x="470" y="275" font-size="12" fill="#3E7C57">最晚升;10–14 天恢復</text>
  <rect x="60" y="450" width="660" height="128" rx="8" fill="#F6F6F8" stroke="#D0D0D6"/>
  <text x="80" y="468" font-size="13" font-weight="bold" fill="#26262B">標記</text>
  <text x="200" y="468" font-size="13" font-weight="bold" fill="#26262B">開始上升</text>
  <text x="400" y="468" font-size="13" font-weight="bold" fill="#26262B">高峰</text>
  <text x="530" y="468" font-size="13" font-weight="bold" fill="#26262B">恢復正常</text>
  <text x="80" y="492" font-size="13" font-weight="bold" fill="#AD5C28">肌紅素</text>
  <text x="200" y="492" font-size="13" font-weight="normal" fill="#AD5C28">1–3 小時</text>
  <text x="400" y="492" font-size="13" font-weight="normal" fill="#AD5C28">6–12 小時</text>
  <text x="530" y="492" font-size="13" font-weight="normal" fill="#AD5C28">約 24 小時</text>
  <text x="80" y="516" font-size="13" font-weight="bold" fill="#2C5A96">CK-MB</text>
  <text x="200" y="516" font-size="13" font-weight="normal" fill="#2C5A96">3–6 小時</text>
  <text x="400" y="516" font-size="13" font-weight="normal" fill="#2C5A96">12–24 小時</text>
  <text x="530" y="516" font-size="13" font-weight="normal" fill="#2C5A96">2–3 天</text>
  <text x="80" y="540" font-size="13" font-weight="bold" fill="#B4485C">Troponin</text>
  <text x="200" y="540" font-size="13" font-weight="normal" fill="#B4485C">3–6 小時(hs 1–3 小時)</text>
  <text x="400" y="540" font-size="13" font-weight="normal" fill="#B4485C">24–48 小時</text>
  <text x="530" y="540" font-size="13" font-weight="normal" fill="#B4485C">I:7–10 天;T:10–14 天</text>
  <text x="80" y="564" font-size="13" font-weight="bold" fill="#3E7C57">LDH</text>
  <text x="200" y="564" font-size="13" font-weight="normal" fill="#3E7C57">24–48 小時</text>
  <text x="400" y="564" font-size="13" font-weight="normal" fill="#3E7C57">3–6 天</text>
  <text x="530" y="564" font-size="13" font-weight="normal" fill="#3E7C57">10–14 天</text>
</svg>