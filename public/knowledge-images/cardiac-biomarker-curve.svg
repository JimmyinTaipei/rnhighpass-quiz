  <line x1="508.5" y1="400" x2="508.5" y2="406" stroke="#26262B"/><text x="508.5" y="422" text-anchor="middle" font-size="12" fill="#26262B">8 天</text>
  <line x1="582.3" y1="400" x2="582.3" y2="406" stroke="#26262B"/><text x="582.3" y="422" text-anchor="middle" font-size="12" fill="#26262B">10 天</text>
  <line x1="656.2" y1="400" x2="656.2" y2="406" stroke="#26262B"/><text x="656.2" y="422" text-anchor="middle" font-size="12" fill="#26262B">12 天</text>
