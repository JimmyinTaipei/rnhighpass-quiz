  <line x1="207.5" y1="400" x2="207.5" y2="406" stroke="#26262B"/><text x="207.5" y="422" text-anchor="middle" font-size="12" fill="#26262B">18h</text>
  <line x1="250.0" y1="400" x2="250.0" y2="406" stroke="#26262B"/><text x="250.0" y="422" text-anchor="middle" font-size="12" fill="#26262B">24h</text>
  <line x1="286.9" y1="400" x2="286.9" y2="406" stroke="#26262B"/><text x="286.9" y="422" text-anchor="middle" font-size="12" fill="#26262B">2 天</text>
  <line x1="323.8" y1="400" x2="323.8" y2="406" stroke="#26262B"/><text x="323.8" y="422" text-anchor="middle" font-size="12" fill="#26262B">3 天</text>
