<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>脂蛋白的來源與去向</title>
  <rect width="760" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555A66"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#26262B">脂蛋白的來源與去向</text>

  <!-- 外源路徑 -->
  <text x="20" y="62" font-size="14" font-weight="bold" fill="#AD5C28">外源性(飯後):運送食物中的脂肪</text>
  <rect x="20" y="74" width="130" height="56" rx="10" fill="#F9EBE3" stroke="#AD5C28" stroke-width="1.5"/>
  <text x="85" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#AD5C28">小腸</text>
  <text x="85" y="118" text-anchor="middle" font-size="12" fill="#26262B">吸收脂肪、膽固醇</text>
  <line x1="150" y1="102" x2="200" y2="102" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="204" y="74" width="150" height="56" rx="28" fill="#FFF7D6" stroke="#AD5C28" stroke-width="1.5"/>
  <text x="279" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#26262B">乳糜微粒</text>
  <text x="279" y="118" text-anchor="middle" font-size="12" fill="#26262B">TG 最多、最大最輕</text>
  <line x1="354" y1="102" x2="404" y2="102" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <text x="362" y="92" font-size="11" fill="#555A66">經淋巴</text>
  <rect x="408" y="74" width="170" height="56" rx="10" fill="#DAF0E5" stroke="#3E7C57" stroke-width="1.5"/>
  <text x="493" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E7C57">肌肉、脂肪組織</text>
  <text x="493" y="118" text-anchor="middle" font-size="12" fill="#26262B">LPL 分解 TG 取用</text>
  <line x1="578" y1="102" x2="628" y2="102" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <text x="694" y="98" text-anchor="middle" font-size="13" fill="#26262B">殘餘顆粒</text>
  <text x="694" y="118" text-anchor="middle" font-size="12" fill="#26262B">回到肝臟</text>
  <line x1="694" y1="128" x2="694" y2="200" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <text x="20" y="152" font-size="12" fill="#555A66">進食後出現,約 9–12 小時清除 → 驗 TG 需空腹</text>

  <!-- 肝臟 -->
  <rect x="560" y="204" width="180" height="84" rx="12" fill="#FDE8EC" stroke="#B4485C" stroke-width="1.5"/>
  <text x="650" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#B4485C">肝臟</text>
  <text x="650" y="254" text-anchor="middle" font-size="12" fill="#26262B">自行合成膽固醇(HMG-CoA</text>
  <text x="650" y="272" text-anchor="middle" font-size="12" fill="#26262B">還原酶,statin 作用處)</text>

  <!-- 內源路徑 -->
  <text x="20" y="194" font-size="14" font-weight="bold" fill="#2C5A96">內源性:運送肝臟製造的脂質</text>
  <line x1="560" y1="246" x2="494" y2="246" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="380" y="218" width="110" height="56" rx="28" fill="#D7E1F2" stroke="#2C5A96" stroke-width="1.5"/>
  <text x="435" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#26262B">VLDL</text>
  <text x="435" y="262" text-anchor="middle" font-size="12" fill="#26262B">主要攜帶 TG</text>
  <line x1="380" y1="246" x2="314" y2="246" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <text x="347" y="238" text-anchor="middle" font-size="11" fill="#555A66">LPL</text>
  <rect x="220" y="218" width="90" height="56" rx="28" fill="#D7E1F2" stroke="#2C5A96" stroke-width="1.5"/>
  <text x="265" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#26262B">IDL</text>
  <line x1="220" y1="246" x2="164" y2="246" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="20" y="218" width="140" height="56" rx="28" fill="#F6D5D9" stroke="#B4485C" stroke-width="2"/>
  <text x="90" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#B4485C">LDL「壞」</text>
  <text x="90" y="262" text-anchor="middle" font-size="12" fill="#26262B">膽固醇最多</text>

  <line x1="90" y1="274" x2="90" y2="318" stroke="#555A66" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="20" y="322" width="250" height="70" rx="10" fill="#F7F8FB" stroke="#B4485C" stroke-width="1.5"/>
  <text x="32" y="346" font-size="13" fill="#26262B">• 經 LDL 受體送進細胞(多回到肝臟)</text>
  <text x="32" y="368" font-size="13" fill="#B4485C" font-weight="bold">• 過多 → 進入動脈內膜、氧化</text>
  <text x="44" y="386" font-size="13" fill="#B4485C" font-weight="bold">→ 泡沫細胞 → 粥狀斑塊</text>

  <!-- HDL -->
  <rect x="330" y="330" width="220" height="60" rx="30" fill="#DAF0E5" stroke="#3E7C57" stroke-width="2"/>
  <text x="440" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E7C57">HDL「好」</text>
  <text x="440" y="375" text-anchor="middle" font-size="12" fill="#26262B">蛋白質最多、密度最高</text>
  <line x1="272" y1="360" x2="326" y2="360" stroke="#3E7C57" stroke-width="2" marker-end="url(#ag)"/>
  <text x="276" y="352" font-size="11" fill="#3E7C57">回收</text>
  <path d="M550,360 C620,360 650,330 650,292" fill="none" stroke="#3E7C57" stroke-width="2" marker-end="url(#ag)"/>
  <text x="600" y="384" font-size="12" fill="#3E7C57">逆向運輸回肝臟</text>
  <text x="600" y="400" font-size="12" fill="#3E7C57">→ 做成膽酸排出</text>

  <text x="20" y="440" font-size="12.5" fill="#555A66">脂蛋白的密度取決於「蛋白質比例」:乳糜微粒 &lt; VLDL &lt; IDL &lt; LDL &lt; HDL。</text>
  <text x="20" y="460" font-size="12.5" fill="#555A66">LDL 的「低密度」代表脂質(膽固醇)比例高、蛋白質比例低,不是脂肪少。</text>
  <text x="20" y="484" font-size="12" fill="#555A66">LPL:脂蛋白脂解酶(fibrate 使其增加)。圖:多保命(原創)</text>
</svg>
