<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>發燒三期</title>
<rect width="1000" height="560" fill="#FFFFFF"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="720" y="80" width="160" height="350" fill="#E8F5E9" opacity="0.6"/>
<rect x="420" y="80" width="300" height="350" fill="#FFEBEE" opacity="0.6"/>
<rect x="260" y="80" width="160" height="350" fill="#E3F2FD" opacity="0.6"/>
<text x="500" y="34" font-size="20" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">發燒三期：設定點與體溫(示意)</text>
<line x1="110" y1="430" x2="940" y2="430" stroke="#333" stroke-width="1.5"/>
<line x1="110" y1="100" x2="110" y2="430" stroke="#333" stroke-width="1.5"/>
<line x1="104" y1="430.0" x2="940" y2="430.0" stroke="#EEEEEE" stroke-width="1"/>
<text x="98" y="435.0" font-size="13" fill="#555" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">36 ℃</text>
<line x1="104" y1="350.0" x2="940" y2="350.0" stroke="#EEEEEE" stroke-width="1"/>
<text x="98" y="355.0" font-size="13" fill="#555" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">37 ℃</text>
<line x1="104" y1="270.0" x2="940" y2="270.0" stroke="#EEEEEE" stroke-width="1"/>
<text x="98" y="275.0" font-size="13" fill="#555" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">38 ℃</text>
<line x1="104" y1="190.0" x2="940" y2="190.0" stroke="#EEEEEE" stroke-width="1"/>
<text x="98" y="195.0" font-size="13" fill="#555" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">39 ℃</text>
<line x1="104" y1="110.0" x2="940" y2="110.0" stroke="#EEEEEE" stroke-width="1"/>
<text x="98" y="115.0" font-size="13" fill="#555" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">40 ℃</text>
<text x="940" y="460" font-size="14" fill="#555" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">時間 →</text>
<path d="M110,350.0 L250,350.0 L270,150.0 L700,150.0 L720,350.0 L940,350.0" stroke="#1565C0" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
<text x="285" y="140.0" font-size="14" fill="#1565C0" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">設定點</text>
<path d="M110,350.0 L260,350.0 C330,350.0 360,158.0000000000001 420,150.0 L720,150.0 C780,158.0000000000001 800,350.0 860,350.0 L940,350.0" stroke="#C62828" stroke-width="3.5" fill="none"/>
<text x="560" y="178.0" font-size="14" fill="#C62828" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">體溫</text>
<text x="340.0" y="102" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">① 畏寒期</text>
<text x="340.0" y="490" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">體溫 &lt; 設定點</text>
<text x="340.0" y="512" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">寒顫、皮膚蒼白冰冷</text>
<text x="340.0" y="534" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">心跳、呼吸加快</text>
<text x="570.0" y="102" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">② 極熱期</text>
<text x="570.0" y="490" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">體溫 ≈ 設定點</text>
<text x="570.0" y="512" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">皮膚潮紅發燙、口渴</text>
<text x="570.0" y="534" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">尿少、頭痛、可能譫妄</text>
<text x="800.0" y="102" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">③ 退熱期</text>
<text x="800.0" y="490" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">體溫 &gt; 設定點</text>
<text x="800.0" y="512" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">大量流汗、皮膚潮濕</text>
<text x="800.0" y="534" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">注意脫水</text>
</svg>
