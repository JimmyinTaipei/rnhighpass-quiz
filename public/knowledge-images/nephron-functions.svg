<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>腎元各段的功能</title>
  <rect width="760" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="nf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555A66"/>
    </marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#26262B">腎元各段的功能</text>

  <!-- 皮質/髓質分界 -->
  <line x1="20" y1="200" x2="740" y2="200" stroke="#C9CCD6" stroke-dasharray="6 5"/>
  <text x="736" y="192" text-anchor="end" font-size="12" fill="#888">皮質</text>
  <text x="736" y="216" text-anchor="end" font-size="12" fill="#888">髓質</text>

  <!-- 腎絲球 -->
  <circle cx="80" cy="110" r="34" fill="#FDE8EC" stroke="#B4485C" stroke-width="2"/>
  <text x="80" y="106" text-anchor="middle" font-size="13" fill="#B4485C">腎小體</text>
  <text x="80" y="122" text-anchor="middle" font-size="11" fill="#B4485C">過濾</text>
  <text x="80" y="164" text-anchor="middle" font-size="11" fill="#26262B">GFR ≈ 125 mL/min</text>
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#26262B">蛋白質、血球不濾過</text>

  <!-- 腎小管 -->
  <path d="M114,110 C140,90 160,130 185,110 C205,94 222,124 240,110 L250,110 L250,430 Q250,462 282,462 Q314,462 314,430 L314,110 L330,110 C350,92 368,128 390,110 C408,96 420,120 440,110 L520,110 L520,520"
        fill="none" stroke="#2C5A96" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.28"/>
  <path d="M114,110 C140,90 160,130 185,110 C205,94 222,124 240,110 L250,110 L250,430 Q250,462 282,462 Q314,462 314,430 L314,110 L330,110 C350,92 368,128 390,110 C408,96 420,120 440,110 L520,110 L520,520"
        fill="none" stroke="#2C5A96" stroke-width="2" stroke-linejoin="round"/>
  <line x1="314" y1="430" x2="314" y2="112" stroke="#2C5A96" stroke-width="6"/>
  <text x="178" y="80" text-anchor="middle" font-size="13" fill="#2C5A96">近曲小管</text>
  <text x="386" y="80" text-anchor="middle" font-size="13" fill="#2C5A96">遠曲小管</text>
  <text x="530" y="512" font-size="13" fill="#2C5A96">集尿管 → 尿液</text>

  <!-- 近曲小管 -->
  <rect x="30" y="226" width="196" height="124" rx="10" fill="#F3F4F8" stroke="#8A8FA0"/>
  <text x="42" y="248" font-size="13" font-weight="bold" fill="#26262B">近曲小管：再吸收最多</text>
  <text x="42" y="268" font-size="12" fill="#26262B">• 約 65% 的 Na⁺ 與水</text>
  <text x="42" y="286" font-size="12" fill="#26262B">• 葡萄糖、胺基酸近 100%</text>
  <text x="42" y="302" font-size="12" fill="#26262B">  (與 Na⁺ 共同運輸)</text>
  <text x="42" y="320" font-size="12" fill="#26262B">• 大部分 HCO₃⁻；分泌 H⁺</text>
  <text x="42" y="338" font-size="12" fill="#26262B">• PTH 抑制磷酸鹽再吸收</text>
  <line x1="150" y1="226" x2="178" y2="122" stroke="#555A66" stroke-width="1.3" marker-end="url(#nf-arr)"/>

  <!-- 下降支 -->
  <rect x="30" y="380" width="196" height="70" rx="10" fill="#EAF1FA" stroke="#2C5A96" stroke-width="1.2"/>
  <text x="42" y="402" font-size="13" font-weight="bold" fill="#2C5A96">下降支</text>
  <text x="42" y="422" font-size="12" fill="#26262B">水可通過、溶質不易</text>
  <text x="42" y="440" font-size="12" fill="#26262B">→ 管腔液越往下越濃</text>
  <line x1="226" y1="414" x2="244" y2="414" stroke="#555A66" stroke-width="1.3" marker-end="url(#nf-arr)"/>

  <!-- 上升支 -->
  <rect x="336" y="226" width="170" height="138" rx="10" fill="#FDE8EC" stroke="#B4485C" stroke-width="1.5"/>
  <text x="348" y="248" font-size="13" font-weight="bold" fill="#B4485C">上升支(粗段)</text>
  <text x="348" y="268" font-size="12" fill="#26262B">• 水不通透</text>
  <text x="348" y="286" font-size="12" fill="#26262B">• Na⁺-K⁺-2Cl⁻ 主動再吸收</text>
  <text x="348" y="304" font-size="12" fill="#26262B">  → 髓質組織間液高滲</text>
  <text x="348" y="322" font-size="12" fill="#26262B">• 管腔液被稀釋</text>
  <text x="348" y="340" font-size="12" fill="#26262B">• 約 25% Na⁺(環利尿劑)</text>
  <line x1="336" y1="290" x2="320" y2="290" stroke="#555A66" stroke-width="1.3" marker-end="url(#nf-arr)"/>

  <!-- 遠曲小管 -->
  <rect x="556" y="44" width="190" height="122" rx="10" fill="#FDF6E3" stroke="#AD5C28" stroke-width="1.5"/>
  <text x="568" y="66" font-size="13" font-weight="bold" fill="#AD5C28">遠曲小管</text>
  <text x="568" y="86" font-size="12" fill="#26262B">• Na⁺-Cl⁻ 再吸收(thiazide)</text>
  <text x="568" y="104" font-size="12" fill="#26262B">• PTH 促進 Ca²⁺ 再吸收</text>
  <text x="568" y="122" font-size="12" fill="#26262B">• 緻密斑：感受 NaCl</text>
  <text x="568" y="140" font-size="12" fill="#26262B">  調節腎素與 GFR</text>
  <text x="568" y="158" font-size="12" fill="#26262B">• 水通透性低</text>
  <path d="M556,104 C520,80 460,76 420,100" fill="none" stroke="#555A66" stroke-width="1.3" marker-end="url(#nf-arr)"/>

  <!-- 集尿管 -->
  <rect x="556" y="226" width="190" height="158" rx="10" fill="#E7F2EA" stroke="#3E7C57" stroke-width="1.5"/>
  <text x="568" y="248" font-size="13" font-weight="bold" fill="#3E7C57">集尿管：最後調整</text>
  <text x="568" y="268" font-size="12" fill="#26262B">• ADH：插入水通道</text>
  <text x="568" y="286" font-size="12" fill="#26262B">  → 回收水、尿液濃縮</text>
  <text x="568" y="306" font-size="12" fill="#26262B">• 醛固酮：回收 Na⁺</text>
  <text x="568" y="324" font-size="12" fill="#26262B">  排出 K⁺ 與 H⁺</text>
  <text x="568" y="344" font-size="12" fill="#26262B">• 高鉀飲食時鉀在這裡</text>
  <text x="568" y="362" font-size="12" fill="#26262B">  分泌增加</text>
  <line x1="556" y1="306" x2="526" y2="306" stroke="#555A66" stroke-width="1.3" marker-end="url(#nf-arr)"/>

  <!-- 直血管 -->
  <rect x="336" y="400" width="170" height="70" rx="10" fill="#FFF4F4" stroke="#B4485C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="348" y="422" font-size="13" font-weight="bold" fill="#B4485C">直血管</text>
  <text x="348" y="442" font-size="12" fill="#26262B">逆流交換：維持</text>
  <text x="348" y="460" font-size="12" fill="#26262B">髓質高滲不被沖淡</text>
</svg>
