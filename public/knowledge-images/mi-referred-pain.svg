<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>心肌缺血疼痛常見部位(轉移痛)</title>
  <rect width="760" height="600" fill="#FFFFFF"/>

  <text x="200" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C5A96">正面</text>

  <!-- 正面人形 -->
  <g fill="#F3EDE6" stroke="#8A7F74" stroke-width="1.5">
    <!-- 腿 -->
    <path d="M142,338 L150,565 L190,565 L197,352 Z"/>
    <path d="M258,338 L250,565 L210,565 L203,352 Z"/>
    <!-- 手臂:畫面左 = 病人右;畫面右 = 病人左 -->
    <path d="M132,152 L106,168 L90,322 L112,324 L134,204 Z"/>
    <path d="M268,152 L294,168 L310,322 L288,324 L266,204 Z"/>
    <circle cx="100" cy="336" r="13"/>
    <circle cx="300" cy="336" r="13"/>
    <!-- 軀幹 -->
    <path d="M130,152 Q200,136 270,152 L262,332 Q200,352 138,332 Z"/>
    <!-- 頸、頭 -->
    <rect x="186" y="112" width="28" height="30"/>
    <circle cx="200" cy="78" r="38"/>
  </g>
  <!-- 胸骨示意 -->
  <line x1="200" y1="165" x2="200" y2="262" stroke="#C9BEB2" stroke-width="3"/>

  <!-- 疼痛區域 -->
  <g fill="#B4485C" stroke="none">
    <ellipse cx="200" cy="212" rx="28" ry="50" opacity="0.55"/>
    <ellipse cx="200" cy="120" rx="34" ry="18" opacity="0.35"/>
    <ellipse cx="282" cy="162" rx="22" ry="14" opacity="0.35"/>
    <path d="M268,196 L279,190 L300,320 L290,324 Z" opacity="0.40"/>
    <circle cx="293" cy="343" r="6" opacity="0.40"/>
    <ellipse cx="200" cy="300" rx="34" ry="20" opacity="0.35"/>
  </g>

  <!-- 編號 -->
  <g font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="200" cy="212" r="11" fill="#8E2F42"/><text x="200" y="217">1</text>
    <circle cx="232" cy="120" r="11" fill="#8E2F42"/><text x="232" y="125">2</text>
    <circle cx="312" cy="160" r="11" fill="#8E2F42"/><text x="312" y="165">3</text>
    <circle cx="200" cy="300" r="11" fill="#8E2F42"/><text x="200" y="305">4</text>
  </g>

  <text x="100" y="385" text-anchor="middle" font-size="12" fill="#6B6B73">病人右側</text>
  <text x="300" y="385" text-anchor="middle" font-size="12" fill="#6B6B73">病人左側</text>
  <text x="330" y="262" font-size="11.5" fill="#8E2F42">沿手臂內側</text>
  <text x="330" y="278" font-size="11.5" fill="#8E2F42">(尺側)至小指</text>

  <!-- 背面小圖 -->
  <text x="380" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5A96">背面</text>
  <g fill="#F3EDE6" stroke="#8A7F74" stroke-width="1.5">
    <path d="M343,458 Q380,450 417,458 L412,560 Q380,570 348,560 Z"/>
    <rect x="372" y="440" width="16" height="16"/>
    <circle cx="380" cy="440" r="18"/>
  </g>
  <line x1="358" y1="472" x2="366" y2="506" stroke="#C9BEB2" stroke-width="2"/>
  <line x1="402" y1="472" x2="394" y2="506" stroke="#C9BEB2" stroke-width="2"/>
  <ellipse cx="380" cy="490" rx="12" ry="22" fill="#B4485C" opacity="0.40"/>
  <circle cx="380" cy="490" r="10" fill="#8E2F42"/>
  <text x="380" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>

  <!-- 右側說明 -->
  <text x="450" y="34" font-size="17" font-weight="bold" fill="#8E2F42">心肌缺血疼痛常見部位</text>
  <g font-size="13.5" fill="#26262B">
    <text x="450" y="64"><tspan font-weight="bold" fill="#8E2F42">1 胸骨後</tspan>:壓迫、緊縮、沉重感</text>
    <text x="466" y="84" font-size="12.5" fill="#6B6B73">最典型;範圍常為一整片、指不出一點</text>
    <text x="450" y="110"><tspan font-weight="bold" fill="#8E2F42">2 頸部、下顎</tspan>:易誤認牙痛、喉嚨痛</text>
    <text x="450" y="136"><tspan font-weight="bold" fill="#8E2F42">3 左肩、左臂內側(尺側)</tspan></text>
    <text x="466" y="156" font-size="12.5" fill="#6B6B73">可延伸至前臂、無名指與小指</text>
    <text x="450" y="182"><tspan font-weight="bold" fill="#8E2F42">4 上腹部(劍突下)</tspan></text>
    <text x="466" y="202" font-size="12.5" fill="#6B6B73">下壁 MI 易被誤認為胃痛、消化不良,</text>
    <text x="466" y="220" font-size="12.5" fill="#6B6B73">可合併噁心、嘔吐</text>
    <text x="450" y="246"><tspan font-weight="bold" fill="#8E2F42">5 背部肩胛骨之間</tspan></text>
  </g>

  <!-- 機轉 -->
  <rect x="440" y="270" width="305" height="220" rx="12" fill="#D7E1F2" stroke="#2C5A96" stroke-width="1.5"/>
  <text x="456" y="296" font-size="15" font-weight="bold" fill="#2C5A96">機轉:轉移痛(referred pain)</text>
  <g font-size="12.5" fill="#26262B">
    <text x="456" y="322">• 心臟的內臟痛覺纖維隨交感神經</text>
    <text x="468" y="340">進入 T1–T4(T5)脊髓節段</text>
    <text x="456" y="364">• 同一節段也接收胸壁、左臂內側</text>
    <text x="468" y="382">(T1–T2 皮節)的體表感覺</text>
    <text x="456" y="406">• 頸部、下顎、肩部經 C3–C5</text>
    <text x="468" y="424">(膈神經分布的心包膜、橫膈)</text>
    <text x="456" y="448">• 大腦無法分辨訊號來源,</text>
    <text x="468" y="466">便把疼痛「投射」到對應皮節</text>
  </g>

  <!-- 非典型提醒 -->
  <rect x="440" y="504" width="305" height="80" rx="12" fill="#FDF6E3" stroke="#AD5C28" stroke-width="1.5"/>
  <text x="456" y="528" font-size="13.5" font-weight="bold" fill="#AD5C28">非典型表現</text>
  <text x="456" y="550" font-size="12.5" fill="#26262B">女性、老人、糖尿病人常以喘、疲倦、</text>
  <text x="456" y="570" font-size="12.5" fill="#26262B">上腹不適表現,甚至無痛(無聲 MI)</text>
</svg>
