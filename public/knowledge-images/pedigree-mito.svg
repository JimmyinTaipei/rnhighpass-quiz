<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>粒線體遺傳(母系遺傳)的家族譜系</title>
<rect width="760" height="560" fill="#FFFFFF"/>
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AD5C28"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C99A4B"/></marker>
<marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0AC"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker></defs>
<text x="380" y="32" font-size="19" text-anchor="middle" font-weight="bold" fill="#26262B">粒線體遺傳(母系遺傳)的家族譜系</text>
<rect x="283" y="93" width="34" height="34" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<circle cx="380" cy="110" r="17" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<line x1="317" y1="110" x2="363" y2="110" stroke="#26262B" stroke-width="1.8"/>
<line x1="340.0" y1="110" x2="340.0" y2="188" stroke="#26262B" stroke-width="1.8"/>
<line x1="170" y1="188" x2="530" y2="188" stroke="#26262B" stroke-width="1.8"/>
<line x1="170" y1="188" x2="170" y2="213" stroke="#26262B" stroke-width="1.8"/>
<line x1="280" y1="188" x2="280" y2="213" stroke="#26262B" stroke-width="1.8"/>
<line x1="420" y1="188" x2="420" y2="213" stroke="#26262B" stroke-width="1.8"/>
<line x1="530" y1="188" x2="530" y2="213" stroke="#26262B" stroke-width="1.8"/>
<rect x="153" y="213" width="34" height="34" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<circle cx="280" cy="230" r="17" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<rect x="403" y="213" width="34" height="34" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<circle cx="530" cy="230" r="17" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<line x1="153" y1="230" x2="97" y2="230" stroke="#26262B" stroke-width="1.8"/>
<circle cx="80" cy="230" r="17" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<line x1="125" y1="230" x2="125" y2="308" stroke="#26262B" stroke-width="1.8"/>
<line x1="90" y1="308" x2="160" y2="308" stroke="#26262B" stroke-width="1.8"/>
<line x1="90" y1="308" x2="90" y2="333" stroke="#26262B" stroke-width="1.8"/>
<line x1="160" y1="308" x2="160" y2="333" stroke="#26262B" stroke-width="1.8"/>
<rect x="73" y="333" width="34" height="34" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<circle cx="160" cy="350" r="17" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<line x1="547" y1="230" x2="623" y2="230" stroke="#26262B" stroke-width="1.8"/>
<rect x="623" y="213" width="34" height="34" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<line x1="585" y1="230" x2="585" y2="308" stroke="#26262B" stroke-width="1.8"/>
<line x1="550" y1="308" x2="620" y2="308" stroke="#26262B" stroke-width="1.8"/>
<line x1="550" y1="308" x2="550" y2="333" stroke="#26262B" stroke-width="1.8"/>
<line x1="620" y1="308" x2="620" y2="333" stroke="#26262B" stroke-width="1.8"/>
<rect x="533" y="333" width="34" height="34" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<circle cx="620" cy="350" r="17" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<text x="24" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#5B6170">I</text>
<text x="24" y="235" font-size="14" text-anchor="middle" font-weight="bold" fill="#5B6170">II</text>
<text x="24" y="355" font-size="14" text-anchor="middle" font-weight="bold" fill="#5B6170">III</text>
<line x1="40" y1="410" x2="720" y2="410" stroke="#D3D6DD"/>
<text x="40" y="438" font-size="13.5" text-anchor="start" fill="#26262B">・粒線體 DNA 只經由卵子傳給下一代，所以只有母親會傳</text>
<text x="40" y="460" font-size="13.5" text-anchor="start" fill="#26262B">・患病母親的子女男女都可能患病；患病父親不會傳給子女</text>
<text x="40" y="482" font-size="13.5" text-anchor="start" fill="#26262B">・同一家族的症狀輕重差異大(每個細胞的突變粒線體比例不同)</text>
<text x="40" y="504" font-size="13.5" text-anchor="start" fill="#26262B">・例：MELAS、Leber 遺傳性視神經病變；主要影響耗能高的腦、肌肉、視神經</text>
<rect x="23" y="513" width="34" height="34" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<text x="66" y="535" font-size="12" text-anchor="start" fill="#26262B">正常男性</text>
<circle cx="150" cy="530" r="17" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<text x="176" y="535" font-size="12" text-anchor="start" fill="#26262B">正常女性</text>
<rect x="243" y="513" width="34" height="34" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<text x="286" y="535" font-size="12" text-anchor="start" fill="#26262B">患病男性</text>
<circle cx="370" cy="530" r="17" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<text x="396" y="535" font-size="12" text-anchor="start" fill="#26262B">患病女性</text>
</svg>