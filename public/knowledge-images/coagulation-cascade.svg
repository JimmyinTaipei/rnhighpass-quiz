<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>凝血瀑布與纖維蛋白溶解</title>
<rect width="1000" height="660" fill="#FFFFFF"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="500" y="34" font-size="22" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">凝血瀑布與纖維蛋白溶解(示意)</text>
<rect x="20" y="55" width="300" height="305" rx="12" fill="#EEF5FF" stroke="#A8C4E8"/>
<text x="170.0" y="80" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">內在路徑(aPTT 反映)</text>
<rect x="45" y="95" width="250" height="46" rx="10" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="170.0" y="124.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">接觸活化(膠原、異物表面)</text>
<rect x="45" y="165" width="250" height="40" rx="10" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="170.0" y="191.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">XII → XIIa</text>
<rect x="45" y="225" width="250" height="40" rx="10" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="170.0" y="251.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">XI → XIa</text>
<rect x="45" y="285" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="170.0" y="308.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">IX → IXa</text>
<text x="170.0" y="330.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">＋ VIIIa、Ca²⁺、磷脂質</text>
<circle cx="291" cy="289" r="12" fill="#6A1B9A"/>
<text x="291" y="294" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">K</text>
<line x1="170" y1="141" x2="170" y2="163" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="170" y1="205" x2="170" y2="223" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="170" y1="265" x2="170" y2="283" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="55" width="300" height="305" rx="12" fill="#FFF4E8" stroke="#E8C4A0"/>
<text x="830.0" y="80" font-size="16" fill="#E65100" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">外在路徑(PT／INR 反映)</text>
<rect x="705" y="95" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#E65100" stroke-width="2"/>
<text x="830.0" y="120.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">組織受傷</text>
<text x="830.0" y="142.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">釋出組織因子(TF)</text>
<rect x="705" y="205" width="250" height="46" rx="10" fill="#FFFFFF" stroke="#E65100" stroke-width="2"/>
<text x="830.0" y="234.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">TF ＋ VII → VIIa</text>
<circle cx="951" cy="209" r="12" fill="#6A1B9A"/>
<text x="951" y="214" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">K</text>
<line x1="830" y1="155" x2="830" y2="203" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<rect x="350" y="255" width="300" height="385" rx="12" fill="#F5F5F5" stroke="#BDBDBD"/>
<text x="500.0" y="280" font-size="16" fill="#424242" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">共同路徑</text>
<rect x="375" y="290" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#424242" stroke-width="2"/>
<text x="500.0" y="313.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">X → Xa</text>
<text x="500.0" y="335.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">＋ Va、Ca²⁺</text>
<circle cx="621" cy="294" r="12" fill="#6A1B9A"/>
<text x="621" y="299" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">K</text>
<rect x="375" y="380" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#424242" stroke-width="2"/>
<text x="500.0" y="403.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">凝血酶原(II)</text>
<text x="500.0" y="425.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">→ 凝血酶(IIa)</text>
<circle cx="621" cy="384" r="12" fill="#6A1B9A"/>
<text x="621" y="389" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">K</text>
<rect x="375" y="470" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#424242" stroke-width="2"/>
<text x="500.0" y="493.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">纖維蛋白原(I)</text>
<text x="500.0" y="515.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">→ 纖維蛋白</text>
<rect x="375" y="560" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<text x="500.0" y="583.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">XIIIa 交聯</text>
<text x="500.0" y="605.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">→ 穩定的纖維蛋白血塊</text>
<line x1="295" y1="313" x2="373" y2="318" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="830" y1="251" x2="627" y2="316" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="500" y1="346" x2="500" y2="378" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="500" y1="436" x2="500" y2="468" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="500" y1="526" x2="500" y2="558" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="380" width="300" height="260" rx="12" fill="#EEF8EE" stroke="#A8D5B0"/>
<text x="830.0" y="405" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">纖維蛋白溶解</text>
<rect x="705" y="420" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="830.0" y="443.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">胞漿素原 → 胞漿素</text>
<text x="830.0" y="465.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">(t-PA 活化)</text>
<rect x="705" y="520" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="830.0" y="550.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">分解纖維蛋白</text>
<text x="830.0" y="572.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">→ FDP、D-dimer 上升</text>
<line x1="830" y1="476" x2="830" y2="518" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="627" y1="588" x2="703" y2="560" stroke="#444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<rect x="20" y="380" width="300" height="260" rx="12" fill="#FAF5FF" stroke="#CDB4E8"/>
<text x="170.0" y="405" font-size="16" fill="#6A1B9A" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">調控與常考重點</text>
<text x="38" y="428" font-size="14" fill="#222" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">Ⓚ 維生素 K 依賴：II、VII、IX、X</text>
<text x="38" y="454" font-size="14" fill="#222" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">　warfarin 抑制 → PT／INR 延長</text>
<text x="38" y="480" font-size="14" fill="#222" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">抗凝血酶(AT)抑制 IIa、Xa</text>
<text x="38" y="506" font-size="14" fill="#222" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">　heparin 加強 AT → aPTT 延長</text>
<text x="38" y="532" font-size="14" fill="#222" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">蛋白質 C、S 抑制 Va、VIIIa</text>
<text x="38" y="558" font-size="14" fill="#222" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">血友病 A 缺 VIII、B 缺 IX</text>
<text x="38" y="584" font-size="14" fill="#222" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">　→ aPTT 延長、PT 正常</text>
<text x="38" y="610" font-size="14" fill="#222" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">Ca²⁺ 是第 IV 因子</text>
</svg>