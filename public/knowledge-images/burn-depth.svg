<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>燒傷深度分級與皮膚分層</title>
<rect width="1040" height="580" fill="#FFFFFF"/>
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AD5C28"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C99A4B"/></marker>
<marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0AC"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker></defs>
<text x="520" y="32" font-size="20" text-anchor="middle" font-weight="bold" fill="#26262B">燒傷深度：傷到皮膚的哪一層</text>
<rect x="150" y="110" width="880" height="30" fill="#F3D2B5" stroke="#9C8463" stroke-width="0.8"/>
<text x="140" y="130.0" font-size="13" text-anchor="end" font-weight="bold" fill="#26262B">表皮</text>
<rect x="150" y="140" width="880" height="55" fill="#F1B9B9" stroke="#9C8463" stroke-width="0.8"/>
<text x="140" y="172.5" font-size="13" text-anchor="end" font-weight="bold" fill="#26262B">真皮(上層)</text>
<rect x="150" y="195" width="880" height="75" fill="#E9A0A3" stroke="#9C8463" stroke-width="0.8"/>
<text x="140" y="237.5" font-size="13" text-anchor="end" font-weight="bold" fill="#26262B">真皮(下層)</text>
<rect x="150" y="270" width="880" height="70" fill="#FBEFB8" stroke="#9C8463" stroke-width="0.8"/>
<text x="140" y="310.0" font-size="13" text-anchor="end" font-weight="bold" fill="#26262B">皮下脂肪</text>
<rect x="150" y="340" width="880" height="50" fill="#C97B7B" stroke="#9C8463" stroke-width="0.8"/>
<text x="140" y="370.0" font-size="13" text-anchor="end" font-weight="bold" fill="#26262B">肌肉、骨骼</text>
<rect x="185.2" y="110" width="105.6" height="30" fill="#3B1F1F" opacity="0.28"/>
<line x1="185.2" y1="140" x2="290.8" y2="140" stroke="#B4485C" stroke-width="3"/>
<text x="238.0" y="88" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#B4485C">表淺(一度)</text>
<rect x="361.2" y="110" width="105.6" height="85" fill="#3B1F1F" opacity="0.28"/>
<line x1="361.2" y1="195" x2="466.8" y2="195" stroke="#B4485C" stroke-width="3"/>
<text x="414.0" y="88" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#B4485C">淺二度(部分皮層)</text>
<line x1="326.0" y1="74" x2="326.0" y2="515" stroke="#D3D6DD" stroke-dasharray="4 4"/>
<rect x="537.2" y="110" width="105.6" height="160" fill="#3B1F1F" opacity="0.28"/>
<line x1="537.2" y1="270" x2="642.8" y2="270" stroke="#B4485C" stroke-width="3"/>
<text x="590.0" y="88" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#B4485C">深二度(部分皮層)</text>
<line x1="502.0" y1="74" x2="502.0" y2="515" stroke="#D3D6DD" stroke-dasharray="4 4"/>
<rect x="713.2" y="110" width="105.6" height="230" fill="#3B1F1F" opacity="0.28"/>
<line x1="713.2" y1="340" x2="818.8" y2="340" stroke="#B4485C" stroke-width="3"/>
<text x="766.0" y="88" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#B4485C">三度(全皮層)</text>
<line x1="678.0" y1="74" x2="678.0" y2="515" stroke="#D3D6DD" stroke-dasharray="4 4"/>
<rect x="889.2" y="110" width="105.6" height="280" fill="#3B1F1F" opacity="0.28"/>
<line x1="889.2" y1="390" x2="994.8" y2="390" stroke="#B4485C" stroke-width="3"/>
<text x="942.0" y="88" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#B4485C">四度</text>
<line x1="854.0" y1="74" x2="854.0" y2="515" stroke="#D3D6DD" stroke-dasharray="4 4"/>
<text x="238.0" y="420" font-size="12.5" text-anchor="middle" fill="#26262B">紅、乾燥</text>
<text x="238.0" y="442" font-size="12.5" text-anchor="middle" fill="#26262B">無水泡</text>
<text x="238.0" y="464" font-size="12.5" text-anchor="middle" fill="#26262B">疼痛</text>
<text x="238.0" y="486" font-size="12.5" text-anchor="middle" fill="#26262B">3–7 天癒合、不留疤</text>
<text x="238.0" y="508" font-size="12.5" text-anchor="middle" fill="#26262B">例：曬傷</text>
<text x="414.0" y="420" font-size="12.5" text-anchor="middle" fill="#26262B">紅、濕潤</text>
<text x="414.0" y="442" font-size="12.5" text-anchor="middle" fill="#26262B">有水泡</text>
<text x="414.0" y="464" font-size="12.5" text-anchor="middle" fill="#26262B">劇痛(神經末梢受刺激)</text>
<text x="414.0" y="486" font-size="12.5" text-anchor="middle" fill="#26262B">約 2–3 週癒合</text>
<text x="414.0" y="508" font-size="12.5" text-anchor="middle" fill="#26262B">通常不留疤</text>
<text x="590.0" y="420" font-size="12.5" text-anchor="middle" fill="#26262B">蒼白或紅白斑駁</text>
<text x="590.0" y="442" font-size="12.5" text-anchor="middle" fill="#26262B">水泡破、較乾</text>
<text x="590.0" y="464" font-size="12.5" text-anchor="middle" fill="#26262B">痛覺減少</text>
<text x="590.0" y="486" font-size="12.5" text-anchor="middle" fill="#26262B">> 3 週、易留疤</text>
<text x="590.0" y="508" font-size="12.5" text-anchor="middle" fill="#26262B">常需植皮</text>
<text x="766.0" y="420" font-size="12.5" text-anchor="middle" fill="#26262B">白、褐或焦黑</text>
<text x="766.0" y="442" font-size="12.5" text-anchor="middle" fill="#26262B">皮革樣、乾硬</text>
<text x="766.0" y="464" font-size="12.5" text-anchor="middle" fill="#26262B">無痛(神經被破壞)</text>
<text x="766.0" y="486" font-size="12.5" text-anchor="middle" fill="#26262B">無法自行癒合</text>
<text x="766.0" y="508" font-size="12.5" text-anchor="middle" fill="#26262B">需切痂植皮</text>
<text x="942.0" y="420" font-size="12.5" text-anchor="middle" fill="#26262B">深及肌肉、骨骼</text>
<text x="942.0" y="442" font-size="12.5" text-anchor="middle" fill="#26262B">焦黑</text>
<text x="942.0" y="464" font-size="12.5" text-anchor="middle" fill="#26262B">無痛</text>
<text x="942.0" y="486" font-size="12.5" text-anchor="middle" fill="#26262B">需重建手術</text>
<text x="942.0" y="508" font-size="12.5" text-anchor="middle" fill="#26262B">電燒傷常見</text>
<text x="520" y="550" font-size="12" text-anchor="middle" fill="#5B6170">燒傷傷口外觀會在 24–72 小時內持續變化，深度要重新評估；面積估計、輸液與植皮照護見肌肉骨骼與皮膚那一輪</text>
</svg>