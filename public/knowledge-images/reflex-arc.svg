<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" viewBox="0 0 960 560"><title>反射弧的五個組成：受器、感覺神經元、中樞、運動神經元、動器</title><path fill="#fff" d="M0 0h960v560H0z"/><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3a6ea5" d="m0 0 10 5-10 5z"/></marker><marker id="c" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#b4485c" d="m0 0 10 5-10 5z"/></marker><marker id="b" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#6b5ca5" d="m0 0 10 5-10 5z"/></marker></defs><text x="480" y="32" fill="#26262b" font-size="20" font-weight="bold" text-anchor="middle">反射弧(以縮回反射為例)</text><ellipse cx="700" cy="250" fill="#f1e6d2" stroke="#9c8a6b" stroke-width="2" rx="165" ry="120"/><path fill="#b9a98c" d="M682 238c-22-18-52-83-37-93 15-5 30 55 55 75 25-20 40-80 55-75 15 10-15 75-37 93 42 22 92 52 77 97-15 20-65-25-95-50-30 25-80 70-95 50-15-45 35-75 77-97"/><circle cx="700" cy="255" r="5" fill="#fff" stroke="#9c8a6b"/><text x="700" y="120" fill="#7a6a4e" font-size="13" font-weight="bold" text-anchor="middle">脊髓(後側在上)</text><text x="830" y="172" fill="#7a6a4e" font-size="12">灰質後角</text><text x="822" y="358" fill="#7a6a4e" font-size="12">灰質前角</text><rect width="70" height="120" x="40" y="70" fill="#fbe3d6" stroke="#d9a88e" rx="10"/><text x="75" y="62" fill="#9a6a52" font-size="12" text-anchor="middle">皮膚</text><path fill="#3a6ea5" d="m70 130 10-14 10 14-10 14z"/><path fill="none" stroke="#3a6ea5" stroke-width="4" marker-end="url(#a)" d="M92 130c108-10 238 0 356 5"/><ellipse cx="470" cy="135" fill="#dce7f3" stroke="#3a6ea5" stroke-width="2" rx="26" ry="18"/><circle cx="470" cy="135" r="8" fill="#3a6ea5"/><text x="470" y="107" fill="#3a6ea5" font-size="12" font-weight="bold" text-anchor="middle">背根神經節</text><text x="470" y="171" fill="#3a6ea5" font-size="11" text-anchor="middle">(感覺神經元細胞體)</text><path fill="none" stroke="#3a6ea5" stroke-width="4" marker-end="url(#a)" d="M494 135c66-10 116 5 156 45"/><text x="550" y="125" fill="#3a6ea5" font-size="12" text-anchor="middle">後根</text><circle cx="665" cy="245" r="9" fill="#6b5ca5"/><path fill="none" stroke="#3a6ea5" stroke-width="3" d="M652 188c-2 22 6 37 10 46"/><path fill="none" stroke="#6b5ca5" stroke-width="3" marker-end="url(#b)" d="M665 254c-3 21-10 36-17 48"/><path fill="#b4485c" d="m640 327-9-9 9-9 9 9z"/><circle cx="640" cy="318" r="10" fill="#b4485c"/><path fill="none" stroke="#b4485c" stroke-width="4" marker-end="url(#c)" d="M632 324c-82 64-212 116-427 106"/><text x="575" y="378" fill="#b4485c" font-size="12" text-anchor="middle">前根</text><ellipse cx="140" cy="430" fill="#e9a8a0" stroke="#b5655c" stroke-width="2" rx="75" ry="34"/><path stroke="#c97c73" d="M80 410h120M80 420h120M80 430h120M80 440h120M80 450h120"/><text x="140" y="486" fill="#9a4a42" font-size="12" text-anchor="middle">骨骼肌(屈肌)</text><circle cx="75" cy="210" r="11" fill="#3a6ea5"/><text x="75" y="215" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">1</text><text x="92" y="215" fill="#3a6ea5" font-size="13" font-weight="bold">受器</text><circle cx="260" cy="108" r="11" fill="#3a6ea5"/><text x="260" y="113" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">2</text><text x="277" y="113" fill="#3a6ea5" font-size="13" font-weight="bold">感覺(傳入)神經元</text><circle cx="665" cy="215" r="11" fill="#6b5ca5"/><text x="665" y="220" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">3</text><text x="682" y="220" fill="#6b5ca5" font-size="13" font-weight="bold">中樞：中間神經元</text><circle cx="420" cy="395" r="11" fill="#b4485c"/><text x="420" y="400" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">4</text><text x="437" y="400" fill="#b4485c" font-size="13" font-weight="bold">運動(傳出)神經元</text><circle cx="140" cy="382" r="11" fill="#b4485c"/><text x="140" y="387" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">5</text><text x="157" y="387" fill="#b4485c" font-size="13" font-weight="bold">動器</text><rect width="380" height="120" x="560" y="420" fill="#f7f7f9" stroke="#dddde2" rx="8"/><text x="575" y="446" fill="#26262b" font-size="13" font-weight="bold">單突觸反射：牽張反射(膝反射)</text><text x="575" y="468" fill="#26262b" font-size="12">肌梭 → Ia 纖維 → 直接接 α 運動神經元，沒有中間神經元</text><text x="575" y="496" fill="#26262b" font-size="13" font-weight="bold">多突觸反射：縮回反射(碰到燙的東西)</text><text x="575" y="518" fill="#26262b" font-size="12">需經中間神經元，屈肌收縮；不必等大腦下指令</text></svg>