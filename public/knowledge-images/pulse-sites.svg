<text x="500" y="845" font-size="13" fill="#555" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">成人最常用橈動脈；休克、CPR 用頸動脈(一次一側)；下肢循環看足背動脈；3 歲以下心尖約第 4 肋間</text>
