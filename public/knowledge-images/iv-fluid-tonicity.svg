<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>輸液張力</title>
<rect width="1000" height="460" fill="#FFFFFF"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="500" y="34" font-size="20" fill="#222" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">紅血球在不同張力溶液中的變化(示意)</text>
<rect x="30" y="60" width="300" height="370" rx="10" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1.5"/>
<text x="180" y="92" font-size="18" fill="#1565C0" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">等張溶液</text>
<rect x="350" y="60" width="300" height="370" rx="10" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1.5"/>
<text x="500" y="92" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">低張溶液</text>
<rect x="670" y="60" width="300" height="370" rx="10" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1.5"/>
<text x="820" y="92" font-size="18" fill="#C62828" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">高張溶液</text>
<ellipse cx="180" cy="220" rx="80" ry="55" fill="#E57373" stroke="#B71C1C" stroke-width="2"/>
<ellipse cx="180" cy="220" rx="35" ry="22" fill="#EF9A9A"/>
<line x1="80" y1="180" x2="110" y2="195" stroke="#1565C0" stroke-width="2" marker-end="url(#arr)"/>
<line x1="255" y1="195" x2="285" y2="180" stroke="#1565C0" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="500" cy="220" r="85" fill="#E57373" stroke="#B71C1C" stroke-width="2"/>
<line x1="380" y1="140" x2="425" y2="170" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="620" y1="140" x2="575" y2="170" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="380" y1="300" x2="425" y2="270" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="620" y1="300" x2="575" y2="270" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arr)"/>
<polygon points="890.0,220.0 875.1,228.3 885.8,240.4 868.5,243.8 873.6,258.2 856.0,256.5 855.0,271.5 839.2,264.7 832.2,278.6 820.0,267.6 807.8,278.6 800.8,264.7 785.0,271.5 784.0,256.5 766.4,258.2 771.5,243.8 754.2,240.4 764.9,228.3 750.0,220.0 764.9,211.7 754.2,199.6 771.5,196.2 766.4,181.8 784.0,183.5 785.0,168.5 800.8,175.3 807.8,161.4 820.0,172.4 832.2,161.4 839.2,175.3 855.0,168.5 856.0,183.5 873.6,181.8 868.5,196.2 885.8,199.6 875.1,211.7" fill="#E57373" stroke="#B71C1C" stroke-width="2"/>
<line x1="775" y1="175" x2="735" y2="145" stroke="#C62828" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="865" y1="175" x2="905" y2="145" stroke="#C62828" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="775" y1="265" x2="735" y2="295" stroke="#C62828" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="865" y1="265" x2="905" y2="295" stroke="#C62828" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="180" y="330" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">水分進出平衡，細胞維持原狀</text>
<text x="180" y="365" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">0.9% NaCl、D5W</text>
<text x="180" y="387" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">林格氏液、乳酸林格氏液</text>
<text x="500" y="330" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">水分進入細胞 → 腫脹、可能破裂</text>
<text x="500" y="365" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">0.45% NaCl、0.33% NaCl</text>
<text x="500" y="387" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">2.5% 葡萄糖</text>
<text x="820" y="330" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">水分移出細胞 → 皺縮</text>
<text x="820" y="365" font-size="13" fill="#C62828" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">10% 以上葡萄糖、3% NaCl</text>
<text x="820" y="387" font-size="13" fill="#C62828" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">D5S</text>
</svg>
