<text x="470.0" y="446.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">和其他胸壁方向相反＝反常(奇異性)呼吸 → 換氣變差、常合併肺挫傷</text>
