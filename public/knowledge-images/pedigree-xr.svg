<circle cx="480" cy="530" r="17" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<circle cx="480" cy="530" r="5.5" fill="#B4485C"/>
<text x="506" y="535" font-size="12" text-anchor="start" fill="#26262B">女性帶因者</text>
