<text x="40" y="438" font-size="13.5" text-anchor="start" fill="#26262B">・患者幾乎都是男性(只有一條 X)；女性多為帶因者</text>
<text x="40" y="460" font-size="13.5" text-anchor="start" fill="#26262B">・帶因母親 × 正常父親：兒子 1/2 患病、女兒 1/2 帶因</text>
<text x="40" y="482" font-size="13.5" text-anchor="start" fill="#26262B">・患病父親：女兒全部帶因、兒子全部正常(沒有父傳子)</text>
<text x="40" y="504" font-size="13.5" text-anchor="start" fill="#26262B">・例：血友病 A 與 B、裘馨氏肌失養症、蠶豆症(G6PD 缺乏)、紅綠色盲、布魯頓氏無丙種球蛋白血症</text>
<rect x="23" y="513" width="34" height="34" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<text x="66" y="535" font-size="12" text-anchor="start" fill="#26262B">正常男性</text>
