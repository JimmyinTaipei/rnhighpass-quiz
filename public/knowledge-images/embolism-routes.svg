<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>栓子的來源與去向：靜脈栓子到肺、動脈栓子到全身</title>
<rect width="1000" height="600" fill="#FFFFFF"/>
<defs>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AD5C28"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker>
<marker id="my" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C99A4B"/></marker>
<marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA0AC"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker></defs>
<text x="500" y="34" font-size="21" text-anchor="middle" font-weight="bold" fill="#26262B">栓子從哪裡來、塞到哪裡</text>
<text x="250" y="70" font-size="16" text-anchor="middle" font-weight="bold" fill="#3A6EA5">靜脈系統的栓子 → 肺</text>
<text x="750" y="70" font-size="16" text-anchor="middle" font-weight="bold" fill="#B4485C">動脈系統的栓子 → 全身器官</text>
<rect x="120" y="90" width="260" height="62" rx="10" fill="#E3EDF8" stroke="#3A6EA5" stroke-width="1.6"/>
<text x="250.0" y="114" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">下肢深部靜脈血栓</text>
<text x="250.0" y="136" font-size="12" text-anchor="middle" fill="#26262B">肺栓塞最常見的來源(膝以上近端)</text>
<rect x="120" y="190" width="260" height="46" rx="10" fill="#E3EDF8" stroke="#3A6EA5" stroke-width="1.6"/>
<text x="250.0" y="214" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#26262B">下腔靜脈 → 右心房 → 右心室</text>
<rect x="120" y="274" width="260" height="62" rx="10" fill="#E3EDF8" stroke="#3A6EA5" stroke-width="1.6"/>
<text x="250.0" y="298" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">肺動脈 → 肺栓塞</text>
<text x="250.0" y="320" font-size="12" text-anchor="middle" fill="#26262B">大的栓子可猝死</text>
<line x1="250" y1="152" x2="250" y2="188" stroke="#3A6EA5" stroke-width="2" marker-end="url(#mb)"/>
<line x1="250" y1="236" x2="250" y2="272" stroke="#3A6EA5" stroke-width="2" marker-end="url(#mb)"/>
<rect x="560" y="90" width="380" height="80" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="750.0" y="114" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">左心或大動脈</text>
<text x="750.0" y="136" font-size="12" text-anchor="middle" fill="#26262B">心房顫動的左心房血栓、心肌梗塞後的附壁血栓</text>
<text x="750.0" y="154" font-size="12" text-anchor="middle" fill="#26262B">感染性心內膜炎的贅生物、頸動脈斑塊</text>
<rect x="560" y="220" width="380" height="46" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="750.0" y="244" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#26262B">主動脈 → 全身動脈</text>
<line x1="750" y1="170" x2="750" y2="218" stroke="#B4485C" stroke-width="2" marker-end="url(#mr)"/>
<rect x="560" y="300" width="70" height="40" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="595" y="325" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#26262B">腦(中風)</text>
<line x1="750" y1="266" x2="595" y2="298" stroke="#B4485C" stroke-width="1.6" marker-end="url(#mr)"/>
<rect x="638" y="300" width="70" height="40" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="673" y="325" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#26262B">腎</text>
<line x1="750" y1="266" x2="673" y2="298" stroke="#B4485C" stroke-width="1.6" marker-end="url(#mr)"/>
<rect x="716" y="300" width="70" height="40" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="751" y="325" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#26262B">脾</text>
<line x1="750" y1="266" x2="751" y2="298" stroke="#B4485C" stroke-width="1.6" marker-end="url(#mr)"/>
<rect x="794" y="300" width="70" height="40" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="829" y="325" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#26262B">腸</text>
<line x1="750" y1="266" x2="829" y2="298" stroke="#B4485C" stroke-width="1.6" marker-end="url(#mr)"/>
<rect x="872" y="300" width="70" height="40" rx="10" fill="#F9E3E6" stroke="#B4485C" stroke-width="1.6"/>
<text x="907" y="325" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#26262B">下肢</text>
<line x1="750" y1="266" x2="907" y2="298" stroke="#B4485C" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="750" y="362" font-size="12" text-anchor="middle" fill="#5B6170">肝臟有雙重血流、靜脈栓子先卡在肺，所以下肢 DVT 不會造成肝臟栓塞</text>
<line x1="40" y1="385" x2="960" y2="385" stroke="#D3D6DD"/>
<text x="500" y="412" font-size="16" text-anchor="middle" font-weight="bold" fill="#26262B">不是血栓的栓子</text>
<rect x="40" y="428" width="220" height="150" rx="10" fill="#F8EADF" stroke="#AD5C28" stroke-width="1.6"/>
<text x="150.0" y="452" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">脂肪栓塞</text>
<text x="150.0" y="474" font-size="12.5" text-anchor="middle" fill="#26262B">長骨或骨盆骨折後</text>
<text x="150.0" y="492.5" font-size="12.5" text-anchor="middle" fill="#26262B">約 24–72 小時</text>
<text x="150.0" y="511.0" font-size="12.5" text-anchor="middle" fill="#26262B">呼吸困難、意識改變、</text>
<text x="150.0" y="529.5" font-size="12.5" text-anchor="middle" fill="#26262B">皮下點狀出血</text>
<rect x="275" y="428" width="220" height="150" rx="10" fill="#F6F7FA" stroke="#9AA0AC" stroke-width="1.6"/>
<text x="385.0" y="452" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">氣體栓塞</text>
<text x="385.0" y="474" font-size="12.5" text-anchor="middle" fill="#26262B">靜脈導管進入空氣</text>
<text x="385.0" y="492.5" font-size="12.5" text-anchor="middle" fill="#26262B">潛水上升太快，氮氣</text>
<text x="385.0" y="511.0" font-size="12.5" text-anchor="middle" fill="#26262B">形成氣泡(減壓症)</text>
<rect x="510" y="428" width="220" height="150" rx="10" fill="#ECE8F6" stroke="#6B5CA5" stroke-width="1.6"/>
<text x="620.0" y="452" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">羊水栓塞</text>
<text x="620.0" y="474" font-size="12.5" text-anchor="middle" fill="#26262B">分娩時或剛分娩後</text>
<text x="620.0" y="492.5" font-size="12.5" text-anchor="middle" fill="#26262B">破水後羊水進入母體</text>
<text x="620.0" y="511.0" font-size="12.5" text-anchor="middle" fill="#26262B">心肺衰竭、休克、DIC</text>
<rect x="745" y="428" width="220" height="150" rx="10" fill="#E6F2EA" stroke="#3E7C57" stroke-width="1.6"/>
<text x="855.0" y="452" font-size="15" text-anchor="middle" font-weight="bold" fill="#26262B">其他</text>
<text x="855.0" y="474" font-size="12.5" text-anchor="middle" fill="#26262B">腫瘤細胞(轉移)</text>
<text x="855.0" y="492.5" font-size="12.5" text-anchor="middle" fill="#26262B">細菌贅生物</text>
<text x="855.0" y="511.0" font-size="12.5" text-anchor="middle" fill="#26262B">異物</text>
</svg>