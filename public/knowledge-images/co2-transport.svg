<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>二氧化碳在血液中的三種運送方式</title>
<rect width="1100" height="450" fill="#FFFFFF"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect x="20" y="60" width="180" height="300" rx="12" fill="#ECEFF1" stroke="#90A4AE"/><text x="110.0" y="90.0" font-size="17" fill="#37474F" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">組織細胞</text>
<text x="110.0" y="118.0" font-size="14" fill="#37474F" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">代謝產生 CO₂</text>
<rect x="230" y="40" width="850" height="350" rx="18" fill="#FFF8E1" stroke="#F9A825"/><text x="250.0" y="66.0" font-size="16" fill="#F57F17" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">血漿</text>
<ellipse cx="610" cy="220" rx="240" ry="135" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/><text x="610.0" y="110.0" font-size="16" fill="#B71C1C" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">紅血球</text>
<path d="M200,220 L360,220" stroke="#333" stroke-width="3" marker-end="url(#m)"/><text x="275.0" y="208.0" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">CO₂</text>
<path d="M210,150 L300,110" stroke="#333" stroke-width="2" marker-end="url(#m)"/><text x="305.0" y="100.0" font-size="15" fill="#333" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">① 溶在血漿 約 7–10%</text>
<path d="M420,205 L470,160" stroke="#333" stroke-width="2" marker-end="url(#m)"/><text x="475.0" y="150.0" font-size="15" fill="#333" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">② ＋血紅素 → 碳醯胺基血紅素 約 20–23%</text>
<text x="380.0" y="232.0" font-size="16" fill="#333" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">CO₂＋H₂O</text>
<path d="M478,226 L548,226" stroke="#333" stroke-width="2" marker-end="url(#m)"/><text x="513.0" y="214.0" font-size="13" fill="#6A1B9A" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">碳酸酐酶</text>
<text x="556.0" y="232.0" font-size="16" fill="#333" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">H₂CO₃</text>
<path d="M618,226 L668,226" stroke="#333" stroke-width="2" marker-end="url(#m)"/><text x="676.0" y="232.0" font-size="16" fill="#333" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">H⁺ ＋ HCO₃⁻</text>
<text x="676.0" y="262.0" font-size="13" fill="#555" text-anchor="start" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">H⁺ 由血紅素緩衝</text>
<rect x="833" y="178" width="34" height="96" rx="16" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2"/><path d="M850,186 L850,266" stroke="#6A1B9A" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M790,210 L940,210" stroke="#1565C0" stroke-width="3.5" marker-end="url(#mb)"/><path d="M940,248 L790,248" stroke="#2E7D32" stroke-width="3" marker-end="url(#mg)"/><text x="948.0" y="206.0" font-size="15" fill="#1565C0" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">HCO₃⁻ 出去</text>
<text x="948.0" y="254.0" font-size="15" fill="#2E7D32" text-anchor="start" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">Cl⁻ 進來</text>
<text x="850.0" y="168.0" font-size="13" fill="#6A1B9A" text-anchor="middle" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">交換蛋白(Band 3)</text>
<text x="850.0" y="296.0" font-size="13" fill="#6A1B9A" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">一個 HCO₃⁻ 換一個 Cl⁻</text>
<text x="1065.0" y="320.0" font-size="15" fill="#1565C0" text-anchor="end" font-weight="bold" stroke="#fff" stroke-width="4" paint-order="stroke">③ 以 HCO₃⁻ 形式在血漿運送</text>
<text x="1065.0" y="342.0" font-size="14" fill="#1565C0" text-anchor="end" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">約 70%(最主要)；Cl⁻ 進入＝氯轉移</text>
<text x="550.0" y="430.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">到了肺部反應反過來：HCO₃⁻ 經同一個交換蛋白回到紅血球、Cl⁻ 出去 → 變回 CO₂ → 擴散進肺泡呼出(去氧血紅素帶 CO₂ 較多＝霍爾丹效應)</text>
</svg>
