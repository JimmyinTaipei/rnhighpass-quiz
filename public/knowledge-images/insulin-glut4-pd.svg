<text x="26" y="468" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="bold" fill="#2C5A96">2</text><text x="46" y="468" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#26262B">啟動細胞內訊息傳遞(IRS → PI3K → Akt)</text>
<text x="26" y="490" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="bold" fill="#2C5A96">3</text><text x="46" y="490" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#26262B">GLUT4 由細胞內囊泡轉位到細胞膜 → 葡萄糖進入肌肉/脂肪細胞</text>
<text x="26" y="512" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="bold" fill="#2C5A96">4</text><text x="46" y="512" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#26262B">合成肝醣(glycogenesis)</text>
<text x="26" y="534" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="bold" fill="#2C5A96">5</text><text x="46" y="534" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#26262B">糖解作用 → 丙酮酸</text>
<text x="26" y="556" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="bold" fill="#2C5A96">6</text><text x="46" y="556" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#26262B">合成脂肪酸、抑制脂肪分解</text>
<text x="26" y="582" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#7A4E86">胰島素阻抗 = 步驟 1–3 效率下降;TZD 經 PPAR-γ 增加敏感性;運動可經 AMPK 讓 GLUT4 不靠胰島素轉位</text>
