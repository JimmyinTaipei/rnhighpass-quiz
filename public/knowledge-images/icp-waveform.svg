<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>顱內壓波形：正常與順應性下降</title>
<rect width="940" height="420" fill="#FFFFFF"/>
<defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26262B"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A6EA5"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E7C57"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4485C"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5CA5"/></marker></defs>
<text x="470.0" y="32" font-size="20" text-anchor="middle" font-weight="bold" fill="#26262B">顱內壓波形：P1、P2、P3</text>
<rect x="40" y="60" width="400" height="300" rx="10" fill="#F7F7F9" stroke="#DDDDE2"/><text x="240.0" y="88" font-size="16" text-anchor="middle" font-weight="bold" fill="#3E7C57">正常：P1 > P2 > P3</text>
<path d="M80,300.0 C90,300.0 98,172.0 108,172.0 C120,172.0 128,224.8 138,224.8 C146,224.8 154,212.0 164,212.0 C176,212.0 180,260.0 188,260.0 C194,260.0 198,244.0 204,244.0 C220,244.0 230,300.0 250,300.0" fill="none" stroke="#3E7C57" stroke-width="3.5"/><text x="108" y="162.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#26262B">P1</text>
<text x="164" y="202.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#26262B">P2</text>
<text x="204" y="234.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#26262B">P3</text>
<path d="M250,300.0 C260,300.0 268,172.0 278,172.0 C290,172.0 298,224.8 308,224.8 C316,224.8 324,212.0 334,212.0 C346,212.0 350,260.0 358,260.0 C364,260.0 368,244.0 374,244.0 C390,244.0 400,300.0 420,300.0" fill="none" stroke="#3E7C57" stroke-width="3.5"/><line x1="70" y1="300" x2="420" y2="300" stroke="#8A8A93" stroke-dasharray="4 4"/><text x="240.0" y="330" font-size="13" text-anchor="middle" font-weight="normal" fill="#26262B">P1(動脈搏動)最高，腦有代償空間</text>
<rect x="500" y="60" width="400" height="300" rx="10" fill="#F7F7F9" stroke="#DDDDE2"/><text x="700.0" y="88" font-size="16" text-anchor="middle" font-weight="bold" fill="#B4485C">順應性下降：P2 > P1</text>
<path d="M540,300.0 C550,300.0 558,204.0 568,204.0 C580,204.0 588,160.79999999999998 598,160.79999999999998 C606,160.79999999999998 614,148.0 624,148.0 C636,148.0 640,244.0 648,244.0 C654,244.0 658,228.0 664,228.0 C680,228.0 690,300.0 710,300.0" fill="none" stroke="#B4485C" stroke-width="3.5"/><text x="568" y="194.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#26262B">P1</text>
<text x="624" y="138.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#26262B">P2</text>
<text x="664" y="218.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#26262B">P3</text>
<path d="M710,300.0 C720,300.0 728,204.0 738,204.0 C750,204.0 758,160.79999999999998 768,160.79999999999998 C776,160.79999999999998 784,148.0 794,148.0 C806,148.0 810,244.0 818,244.0 C824,244.0 828,228.0 834,228.0 C850,228.0 860,300.0 880,300.0" fill="none" stroke="#B4485C" stroke-width="3.5"/><line x1="530" y1="300" x2="880" y2="300" stroke="#8A8A93" stroke-dasharray="4 4"/><text x="700.0" y="330" font-size="13" text-anchor="middle" font-weight="normal" fill="#26262B">P2 升高：代償快用完，顱內壓容易急升</text>
<text x="470.0" y="400" font-size="13" text-anchor="middle" font-weight="normal" fill="#8A8A93">P1 打擊波(動脈收縮)；P2 潮汐波(反映腦的順應性)；P3 重搏波(主動脈瓣關閉)</text>
</svg>
