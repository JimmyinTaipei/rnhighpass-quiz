<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <title>腹膜透析的換液步驟</title>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <defs>
    <marker id="pd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C5A96"/>
    </marker>
    <marker id="pd-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B08A2E"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#26262B">腹膜透析(CAPD)的換液步驟</text>

  <!-- 共用：軀幹 -->

  <!-- ===== 1 灌入 ===== -->
  <g transform="translate(15,50)">
    <text x="125" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#26262B">① 灌入</text>
    <!-- 透析液袋在高處 -->
    <rect x="40" y="36" width="56" height="70" rx="8" fill="#EAF1FA" stroke="#2C5A96" stroke-width="2"/>
    <text x="68" y="76" text-anchor="middle" font-size="11" fill="#2C5A96">新透析液</text>
    <text x="68" y="92" text-anchor="middle" font-size="10" fill="#2C5A96">約 2 L</text>
    <!-- 軀幹 -->
    <path d="M140,70 C180,62 230,66 240,90 L246,250 C246,280 220,296 190,296 L150,296 C124,296 112,280 112,250 L116,100 C118,84 126,74 140,70 Z" fill="#FBEFE6" stroke="#C9A58C" stroke-width="2"/>
    <!-- 腹膜腔 -->
    <path d="M128,160 C140,140 220,140 232,160 L234,250 C234,272 216,284 192,284 L166,284 C142,284 126,272 126,250 Z" fill="#DCEAF7" stroke="#2C5A96" stroke-dasharray="5 4"/>
    <!-- 管路 -->
    <path d="M68,106 L68,220 C68,236 90,240 128,236" fill="none" stroke="#555A66" stroke-width="3"/>
    <path d="M128,236 L176,248" stroke="#555A66" stroke-width="3"/>
    <line x1="80" y1="140" x2="80" y2="200" stroke="#2C5A96" stroke-width="2.5" marker-end="url(#pd-arr)"/>
    <text x="125" y="320" text-anchor="middle" font-size="12" fill="#26262B">加溫到約 37 ℃，袋子放高</text>
    <text x="125" y="338" text-anchor="middle" font-size="12" fill="#26262B">靠重力流入，約 10 分鐘</text>
    <text x="125" y="356" text-anchor="middle" font-size="12" fill="#26262B">太快會肩膀痛</text>
  </g>

  <!-- ===== 2 留置 ===== -->
  <g transform="translate(280,50)">
    <text x="125" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#26262B">② 留置</text>
    <path d="M140,70 C180,62 230,66 240,90 L246,250 C246,280 220,296 190,296 L150,296 C124,296 112,280 112,250 L116,100 C118,84 126,74 140,70 Z" fill="#FBEFE6" stroke="#C9A58C" stroke-width="2"/>
    <path d="M128,160 C140,140 220,140 232,160 L234,250 C234,272 216,284 192,284 L166,284 C142,284 126,272 126,250 Z" fill="#B9D5EE" stroke="#2C5A96"/>
    <!-- 導管折好收在衣內 -->
    <path d="M128,236 L176,248" stroke="#555A66" stroke-width="3"/>
    <path d="M128,236 C110,232 100,220 106,212" fill="none" stroke="#555A66" stroke-width="3"/>
    <circle cx="128" cy="236" r="4" fill="#26262B"/>
    <text x="40" y="226" text-anchor="middle" font-size="11" fill="#26262B">導管出口</text>
    <line x1="64" y1="230" x2="122" y2="236" stroke="#26262B" stroke-width="1"/>
    <!-- 腹膜交換 -->
    <text x="182" y="200" text-anchor="middle" font-size="12" fill="#26262B">腹膜＝半透膜</text>
    <text x="182" y="218" text-anchor="middle" font-size="11" fill="#26262B">廢物、水 → 透析液</text>
    <text x="182" y="236" text-anchor="middle" font-size="11" fill="#26262B">葡萄糖 → 血液</text>
    <text x="125" y="320" text-anchor="middle" font-size="12" fill="#26262B">關管夾，每袋留 4–6 小時</text>
    <text x="125" y="338" text-anchor="middle" font-size="12" fill="#26262B">可照常活動、上班上學</text>
  </g>

  <!-- ===== 3 引流 ===== -->
  <g transform="translate(540,50)">
    <text x="125" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#26262B">③ 引流</text>
    <path d="M140,70 C180,62 230,66 240,90 L246,250 C246,280 220,296 190,296 L150,296 C124,296 112,280 112,250 L116,100 C118,84 126,74 140,70 Z" fill="#FBEFE6" stroke="#C9A58C" stroke-width="2"/>
    <path d="M128,160 C140,140 220,140 232,160 L234,250 C234,272 216,284 192,284 L166,284 C142,284 126,272 126,250 Z" fill="#F7EFD4" stroke="#B08A2E" stroke-dasharray="5 4"/>
    <path d="M176,248 L128,236 C96,228 52,222 48,236" fill="none" stroke="#555A66" stroke-width="3"/>
    <!-- 引流袋在低處 -->
    <rect x="20" y="236" width="56" height="56" rx="8" fill="#FDF6E3" stroke="#B08A2E" stroke-width="2"/>
    <text x="48" y="262" text-anchor="middle" font-size="11" fill="#8A6A1E">引流袋</text>
    <text x="48" y="278" text-anchor="middle" font-size="10" fill="#8A6A1E">放低</text>
    <line x1="104" y1="214" x2="74" y2="234" stroke="#B08A2E" stroke-width="2.5" marker-end="url(#pd-arr-y)"/>
    <text x="125" y="320" text-anchor="middle" font-size="12" fill="#26262B">靠重力流出，約 10–20 分鐘</text>
    <text x="125" y="338" text-anchor="middle" font-size="12" fill="#26262B">正常：清澈無色</text>
    <text x="125" y="356" text-anchor="middle" font-size="12" fill="#B4485C">混濁＋腹痛 → 懷疑腹膜炎</text>
  </g>

  <text x="400" y="438" text-anchor="middle" font-size="12" fill="#555A66">一天換 3–5 次，每次約 20–30 分鐘；接管、換液全程無菌，先戴口罩、洗手</text>
</svg>
