<line x1="520" y1="230" x2="520" y2="308" stroke="#26262B" stroke-width="1.8"/>
<line x1="470" y1="308" x2="570" y2="308" stroke="#26262B" stroke-width="1.8"/>
<line x1="470" y1="308" x2="470" y2="333" stroke="#26262B" stroke-width="1.8"/>
