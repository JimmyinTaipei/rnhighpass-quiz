<text x="24" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#5B6170">I</text>
<text x="24" y="235" font-size="14" text-anchor="middle" font-weight="bold" fill="#5B6170">II</text>
<text x="24" y="355" font-size="14" text-anchor="middle" font-weight="bold" fill="#5B6170">III</text>
<line x1="40" y1="410" x2="720" y2="410" stroke="#D3D6DD"/>
<text x="40" y="438" font-size="13.5" text-anchor="start" fill="#26262B">・每一代都有患者(垂直傳遞)；男女機率相同</text>
<text x="40" y="460" font-size="13.5" text-anchor="start" fill="#26262B">・患者(多為異型合子)與正常人的子女：每胎 1/2 患病</text>
<text x="40" y="482" font-size="13.5" text-anchor="start" fill="#26262B">・可以父傳子；正常的子女不會再往下傳</text>
<text x="40" y="504" font-size="13.5" text-anchor="start" fill="#26262B">・例：亨丁頓舞蹈症、馬凡氏症、軟骨發育不全、成人型多囊腎、家族性高膽固醇血症</text>
<rect x="23" y="513" width="34" height="34" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<text x="66" y="535" font-size="12" text-anchor="start" fill="#26262B">正常男性</text>
<circle cx="150" cy="530" r="17" fill="#FFFFFF" stroke="#26262B" stroke-width="1.8"/>
<text x="176" y="535" font-size="12" text-anchor="start" fill="#26262B">正常女性</text>
<rect x="243" y="513" width="34" height="34" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<text x="286" y="535" font-size="12" text-anchor="start" fill="#26262B">患病男性</text>
<circle cx="370" cy="530" r="17" fill="#B4485C" stroke="#26262B" stroke-width="1.8"/>
<text x="396" y="535" font-size="12" text-anchor="start" fill="#26262B">患病女性</text>
