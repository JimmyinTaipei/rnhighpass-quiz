# 知識庫受控分類表
#
# 這是知識庫「分類」的唯一來源。每篇文章的 frontmatter 只能引用這裡有的 id:
#   system: <domain id>        必填,主分類
#   alsoIn: [<domain id>, ...] 選填,次分類(會出現在該分類清單並標「也見於」)
#   group:  <group id>         選填,必須是主分類底下、且 type 與文章資料夾相符的群組
# 寫錯或不存在時 `pnpm knowledge:build` 會失敗並列出可用的 id——這是防止 junk tag 的機制。
#
# ── 怎麼選 system ─────────────────────────────────────────────
# 1. 先看器官系統(kind: system,對應題庫十大 block: 標籤)。
# 2. 精神疾病與精神科用藥 → psychiatric;體液/電解質/酸鹼 → fluid-acid-base;
#    病原體與抗微生物藥 → infection(即使感染部位在某器官,如肺炎仍放 respiratory,
#    但「抗生素」「結核病藥」這類以病原為中心的內容放 infection)。
# 3. 分不出器官系統的護理技術、行政、社區內容 → 用科目(kind: subject)。
# 4. 跨多系統時選「國考最常從哪個系統考」為主,其他放 alsoIn。
#
# ── 新增 domain 或 group 的流程 ────────────────────────────────
# - 先確認現有的放不下,再新增;id 用小寫英文與 -,一旦有文章使用就不要改名。
# - group 的 drugTags 列出題庫 drug 標籤(Tag_List_and_Statistics.md 第三節)中
#   所有同義詞,::questions{group="..."} 會用它們查題。
# - 沒有文章的 domain/group 會在首頁顯示成「即將加入」或不顯示,不影響使用。
#
# ── 分章題本 → domain 對照(依 hierarchy_question_counts.md) ─────
# 生解 Ch05 神經、Ch06 感覺 → neuro;Ch07 血液心血管淋巴 → cardiovascular / hematology-immunology
# 生解 Ch08 → respiratory;Ch09 → digestive;Ch10 → renal;Ch11 → fluid-acid-base
# 生解 Ch12 → endocrine;Ch13、Ch14 → reproductive;Ch02 → integumentary;Ch03、Ch04 → musculoskeletal
# 病理 Ch09~Ch18 依器官;Ch05 免疫、Ch10 血液 → hematology-immunology;Ch08 感染 → infection
# 藥理 Ch02 自主神經、Ch04 止痛麻醉 → neuro;Ch03 中樞與精神科 → neuro(抗癲癇、巴金森)/ psychiatric(抗精神病、抗憂鬱等)
# 藥理 Ch05 → respiratory;Ch06 → digestive;Ch07 → renal;Ch08 → cardiovascular;Ch09 → hematology-immunology
# 藥理 Ch10 → endocrine;Ch11 → infection;Ch12 → hematology-immunology(癌症藥暫放此,量多時再開 oncology)
# 微免 → infection(Ch02、Ch03 免疫 → hematology-immunology)
# 內外 Ch04 → fluid-acid-base;Ch05 → infection;其餘依器官;Ch03 癌症、Ch06 急重症 → 依主要器官或 fundamentals
# 產科 → reproductive;兒科依器官(Ch02 生長發展 → fundamentals)
# 精神 → psychiatric;社區 → community;基護 → fundamentals;行政 → administration

types:
  disease: 疾病
  physiology: 生理機轉
  drug: 藥物
  lab: 檢驗

